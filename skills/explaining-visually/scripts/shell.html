    before.forEach((el, i) => unused.set(sourceOf(el), [...(unused.get(sourceOf(el)) ?? []), i]));
    const sequence = [...next.children].map((el) => {
      const i = unused.get(sourceOf(el))?.shift();
      if (i === undefined) {
        return document.importNode(el, true);
      }
      const kept = liveOf[i];
      renumber(kept, lineMap(before[i], el));
      liveOf[i] = null;
      return kept;
    });
    parkMore();
    liveOf.filter(Boolean).forEach((el) => el.remove());
    $('main').append(...sequence);
    placeScriptNodes();
    pristine = document.createElement('template');
    pristine.innerHTML = next.innerHTML;
    liveOf = sequence;
  }

  function placeScriptNodes() {
    const zone = $('.qzone');
    if (zone && $('main').firstElementChild !== zone) {
      $('main').prepend(zone);
    }
    const note = $('.draft-note');
    const before = $('main > .lede') ?? $('main > h1') ?? zone;
    if (note && before && before.nextElementSibling !== note) {
      before.after(note);
    }
  }

  function afterBodyChange() {
    tagTargets();
    mores.clear();
    document.querySelectorAll('.has-more').forEach((el) => el.classList.remove('has-more'));
    document.querySelectorAll('main .ibadge').forEach((el) => el.remove());
    collectMores();
    syncLives();
    addLegends();
    addSectionButtons();
    buildTocLinks();
    questions = [...document.querySelectorAll('main .q[id]')];
    if (questions.length && !$('.qzone')) {
      setupQuestions();
    }
    reopened = reopened && questions.find((q) => q.id === reopened.id);
    workingSig = null;
    hot = null;
    cbtn.classList.remove('show');
    reanchorPop();
    reattachSheet();
    render();
  }

  function reanchorPop() {
    const pop = openPopEl();
    const anchor = pop?.dataset.ct && findTarget(pop.dataset.ct);
    if (anchor) {
      placePop(pop, anchor);
    }
  }

  function reattachSheet() {
    if (!sheetOwner) {
      return;
    }
    const owner = findTarget(sheetOwner.dataset.ct);
    if (!owner) {
      closeSheet();
      return;
    }
    const shown = $('.sheet-body aside.more');
    if (owner === sheetOwner && (shown ?? null) === (mores.get(owner) ?? null)) {
      return;
    }
    sheetOwner.classList.remove('sheet-owner');
    sheetOwner = owner;
    owner.classList.add('sheet-owner');
    const asked = $('.sheet .ask textarea')?.value ?? '';
    renderSheet();
    const ta = $('.sheet .ask textarea');
    if (ta) {
      ta.value = asked;
    }
  }

  // Moving a node blurs whatever the reader was typing in; the caret goes back where it was.
  function keepingFocus(change) {
    const active = document.activeElement;
    const typing = active?.matches?.('textarea, input');
    const [start, end] = typing ? [active.selectionStart, active.selectionEnd] : [0, 0];
    const sheetAsk = active?.closest?.('.sheet .ask');
    change();
    const target = sheetAsk && !active.isConnected ? $('.sheet .ask textarea') : active;
    if (typing && target?.isConnected && document.activeElement !== target) {
      target.focus({ preventScroll: true });
      target.setSelectionRange(start, end);
    }
  }

  // Keeps the element at the top of the viewport where it was, however much changed above it.
  function keepingScroll(change) {
    const anchor = [...document.querySelectorAll('main [data-ct]')].find((el) => el.getBoundingClientRect().bottom > 0);
    const ct = anchor?.dataset.ct;
    const top = anchor?.getBoundingClientRect().top;
    change();
    const again = ct && findTarget(ct);
    if (again) {
      scrollBy(0, again.getBoundingClientRect().top - top);
    }
  }

  async function updateBody(v) {
    if (bodyBusy) {
      return;
    }
    bodyBusy = true;
    try {
      const next = await fetchMain();
      keepingFocus(() => keepingScroll(() => {
        applyBody(next);
        afterBodyChange();
      }));
      bodyVersion = v;
    } finally {
      bodyBusy = false;
    }
  }

  function changedElements(lines) {
    const wanted = new Set(lines.map(String));
    const changed = [...document.querySelectorAll('main [data-line], .sheet-body [data-line]')].filter((el) => wanted.has(el.dataset.line) && el.parentElement.dataset.line !== el.dataset.line);
    const outermost = changed.filter((el) => !changed.some((outer) => outer !== el && outer.contains(el)));
    return [...new Set(outermost.map(ownerOf))];
  }

  function markChanged() {
    document.querySelectorAll('.delta').forEach((el) => el.classList.remove('delta'));
    unseen().filter((c) => c.reply.lines?.length).forEach((c) => changedElements(c.reply.lines).forEach((el) => el.classList.add('delta')));
  }

  let resolved = {};
  const timeOf = (iso) => (iso ? Date.parse(iso) : 0);
  const inThread = (c) => c.kind !== 'answer' && c.kind !== 'approve';
  const latestReply = (thread) => thread.items.filter((c) => c.reply).pop() ?? null;

  function threadsOf() {
    const byKey = new Map();
    const threadOf = (key) => {
      if (!byKey.has(key)) {
        byKey.set(key, { key, items: [], drafts: [], latestAt: 0, resolved: false });
      }
      return byKey.get(key);
    };
    sent.filter(inThread).forEach((c) => {
      const thread = threadOf(c.target);
      thread.items.push(c);
      thread.latestAt = Math.max(thread.latestAt, timeOf(c.sentAt), timeOf(c.reply?.at));
    });
    drafts.filter(inThread).forEach((c) => threadOf(c.target).drafts.push(c));
    return [...byKey.values()].map((t) => ({ ...t, resolved: Boolean(resolved[t.key]) && timeOf(resolved[t.key]) >= t.latestAt }));
  }

  // A renamed element is found again by its source line, then through what a reply changed, then its section.
  function anchorFor(thread) {
    if (thread.key === 'document') {
      return null;
    }
    const found = findTarget(thread.key);
    return (found && ownerOf(found)) ?? lineAnchor(thread) ?? replyAnchor(thread) ?? sectionAnchor(thread);
  }

  function lineAnchor(thread) {
    const line = thread.items.find((c) => c.now)?.now;
    const el = line && document.querySelector(`main [data-line="${line}"]`);
    return el ? ownerOf(el.closest('[data-ct]') ?? el) : null;
  }

  const replyAnchor = (thread) => thread.items.filter((c) => c.reply?.lines?.length).reverse().map((c) => changedElements(c.reply.lines)[0]).find(Boolean) ?? null;
  const sectionAnchor = (thread) => [...document.querySelectorAll('main section > h2')].find((h) => h.textContent.trim() === thread.key.split(' › ')[0]) ?? null;

  function ago(iso) {
    const seconds = (Date.now() - timeOf(iso)) / 1000;
    if (!iso || seconds < 60) {
      return 'now';
    }
    if (seconds < 3600) {
      return `${Math.floor(seconds / 60)} min`;
    }
    if (seconds < 86400) {
      return `${Math.floor(seconds / 3600)} h`;
    }
    return new Date(iso).toLocaleDateString();
  }

  function chip(kind, text, spinning) {
    const span = document.createElement('span');
    span.className = `chip ${kind}`;
    if (spinning) {
      span.append(loader(text));
    }
    span.append(text);
    return span;
  }

  function changedLabel(lines) {
    const section = changedElements(lines)[0]?.closest('section');
    const h2 = section?.querySelector('h2');
    if (!h2) {
      return 'changed';
    }
    const n = [...document.querySelectorAll('main section')].indexOf(section) + 1;
    return `changed · ${String(n).padStart(2, '0')} ${tidy(h2.textContent)}`;
  }

  const messagesOf = (thread) => thread.items.flatMap((c) => [{ id: c.id, who: 'me', c }, ...(c.reply ? [{ id: `${c.id}:r`, who: 'claude', c }] : [])]);
  const messageText = (c) => (c.kind === 'expand' ? c.text || 'Expand this' : c.text);

  function messageEl(m) {
    const el = document.createElement('div');
    el.className = `msg ${m.who}`;
    el.dataset.id = m.id;
    el.innerHTML = '<div class="who"><span></span><small></small></div><div class="text"></div>';
    el.querySelector('.who span').textContent = m.who === 'me' ? 'You' : 'Claude';
    el.querySelector('small').dataset.at = (m.who === 'me' ? m.c.sentAt : m.c.reply.at) ?? '';
    el.querySelector('.text').textContent = m.who === 'me' ? messageText(m.c) : m.c.reply.text;
    if (m.who === 'me' && !m.c.reply) {
      el.append(chip('waiting', 'Claude is working', true));
    }
    if (m.who === 'claude' && m.c.reply.lines?.length) {
      el.append(chip('changed', changedLabel(m.c.reply.lines)));
    }
    if (m.who === 'claude' && m.c.kind === 'expand') {
      el.append(infoLink(m.c));
    }
    return el;
  }

  function infoLink(c) {
    const b = document.createElement('button');
    b.className = 'info-link';
    b.dataset.a = 'info';
    b.textContent = 'Show in Info';
    b.onclick = (e) => {
      e.stopPropagation();
      const thread = threadsOf().find((t) => t.key === c.target);
      const owner = thread && anchorFor(thread);
      if (owner) {
        openSheet(owner, 'info');
      }
    };
    return b;
  }

  const expandedKeys = new Set();
  const shownMsgs = new Set();
  const cards = new Map();
  const showIndex = new Map();
  let anchors = new Map();
  let marginReady = false;
  const FOLD_KEY = `${KEY}:folded`;
  let foldedKeys = new Set();
  try { foldedKeys = new Set(JSON.parse(localStorage.getItem(FOLD_KEY)) || []); } catch {}
  const marginHidden = () => !$('.margin').offsetParent;

  function setFolded(key, folded) {
    if (folded) {
      (cards.get(key)?.thread.items ?? []).filter((c) => c.reply).forEach((c) => seenIds?.add(c.id));
      saveSeen();
      foldedKeys.add(key);
    } else {
      foldedKeys.delete(key);
    }
    try { localStorage.setItem(FOLD_KEY, JSON.stringify([...foldedKeys])); } catch {}
    render();
  }

  function draftEl(c) {
    const el = messageEl({ id: c.id, who: 'me', c: { ...c, reply: { text: '', lines: [] } } });
    el.classList.add('draft');
    el.append(chip('draft', 'not sent'));
    return el;
  }

  function threadCard(thread) {
    const card = document.createElement('div');
    card.className = thread.key === 'document' ? 'thread general' : 'thread';
    card.dataset.key = thread.key;
    card.onclick = (e) => onThreadClick(e, thread.key);
    const msgs = messagesOf(thread);
    if (foldedKeys.has(thread.key)) {
      card.classList.add('folded');
      card.textContent = `💬 ${msgs.length + thread.drafts.length}`;
      card.title = 'Unfold';
      return card;
    }
    const earlier = msgs.length > 3 && !expandedKeys.has(thread.key) ? msgs.length - 1 : 0;
    msgs.slice(earlier).forEach((m) => card.append(messageEl(m)));
    if (earlier) {
      const more = document.createElement('button');
      more.className = 'earlier';
      more.dataset.a = 'earlier';
      more.textContent = `▾ ${earlier} earlier in this thread`;
      card.append(more);
    }
    thread.drafts.forEach((c) => card.append(draftEl(c)));
    card.append(threadTools(thread));
    return card;
  }

  function threadTools(thread) {
    const tools = document.createElement('div');
    tools.className = 'tools';
    tools.innerHTML = '<div class="actions"><button data-a="show">Show change</button><button data-a="open-info">ⓘ Info</button><button data-a="open-code">‹/› Code</button><button data-a="fold">Fold</button><button data-a="resolve">Resolve</button></div><textarea rows="1" placeholder="Reply…"></textarea><div class="row"><button data-a="batch">Add to batch</button><button data-a="send" class="primary">Send now ⌘↵</button></div>';
    const anchor = anchorFor(thread);
    tools.querySelector('[data-a=show]').hidden = !latestReply(thread)?.reply.lines?.length;
    tools.querySelector('[data-a=open-info]').hidden = !anchor || !mores.has(anchor);
    tools.querySelector('[data-a=open-code]').hidden = !anchor || !served || !refsFor(anchor).length;
    tools.querySelector('[data-a=resolve]').hidden = !thread.items.length || thread.resolved;
    tools.querySelector('textarea').onkeydown = (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        replyFrom(e.target, thread.key, true);
      }
      if (e.key === 'Escape') {
        e.stopPropagation();
        e.target.blur();
      }
    };
    return tools;
  }

  const threadByKey = (key) => threadsOf().find((t) => t.key === key);

  function runThreadAction(e, key, root) {
    const thread = threadByKey(key);
    const reply = (now) => replyFrom(root.querySelector('.tools textarea'), key, now);
    const actions = {
      earlier: () => { expandedKeys.add(key); renderMargin(); },
      show: () => showChange(thread),
      'open-info': () => openSheet(anchorFor(thread), 'info'),
      'open-code': () => openSheet(anchorFor(thread), 'code'),
      fold: () => setFolded(key, true),
      resolve: () => resolveThread(key, true),
      send: () => reply(true),
      batch: () => reply(false),
    };
    const action = actions[e.target.closest('[data-a]')?.dataset.a];
    if (action) {
      action();
    }
    return Boolean(action);
  }

  function onThreadClick(e, key) {
    if (e.target.closest('textarea') || getSelection()?.toString()) {
      return;
    }
    if (foldedKeys.has(key)) {
      setFolded(key, false);
      return;
    }
    if (!runThreadAction(e, key, cards.get(key).el)) {
      selectThread(threadByKey(key));
    }
  }

  function onPanelThreadClick(e, key, item) {
    if (e.target.closest('textarea') || getSelection()?.toString()) {
      return;
    }
    if (!runThreadAction(e, key, item)) {
      flashChange(threadByKey(key));
    }
  }

  let selectedKey = null;

  // Wide screens select the thread in the margin; without a margin, the panel shows it alone.
  function selectThread(thread, reply = false) {
    if (!thread) {
      return;
    }
    if (marginHidden() || thread.resolved) {
      openThreadInPanel(thread);
      return;
    }
    selectedKey = thread.key;
    markSeen(thread.items.filter((c) => c.reply).map((c) => c.id));
    expandedKeys.add(thread.key);
    if (foldedKeys.has(thread.key)) {
      setFolded(thread.key, false);
    } else {
      renderMargin();
    }
    flashChange(thread);
    if (reply) {
      cards.get(thread.key)?.el.querySelector('.tools textarea')?.focus({ preventScroll: true });
    }
  }

  // An element with a thread opens its sheet like any other, then the thread takes the place of the comment popover.
  function openElementThread(el, thread) {
    if (!followsSheet(el) || sheetOwner === el) {
      selectThread(thread, true);
      return;
    }
    openSheet(el, defaultTab(el), () => selectThread(thread, true));
  }

  function clearSelection() {
    if (!selectedKey) {
      return false;
    }
    selectedKey = null;
    link();
    return true;
  }

  function threadOn(el) {
    return threadsOf().find((t) => t.items.length && (t.key === el.dataset.ct || anchorFor(t) === el));
  }

  // A reply carries Claude's last answer as its quote, so the agent sees which thread it continues.
  function threadReply(thread, text) {
    const last = latestReply(thread);
    const quote = last ? `↩ ${last.reply.text}`.slice(0, 300) : '';
    return { ...commentFrom(anchorFor(thread), text, quote), target: thread.key };
  }

  function replyFrom(ta, key, now) {
    const thread = threadByKey(key);
    const text = ta?.value.trim();
    if (!thread || !text) {
      return;
    }
    ta.value = '';
    const c = threadReply(thread, text);
    if (now) {
      post([c]);
      return;
    }
    drafts.push(c);
    persist();
    render();
  }

  // A poll already in flight carries the old map; the reader's choice holds until the server agrees.
  const pendingResolve = new Map();

  function mergeResolved(server) {
    const merged = { ...server };
    pendingResolve.forEach((at, key) => {
      if (Boolean(server[key]) === Boolean(at)) {
        pendingResolve.delete(key);
      } else if (at) {
        merged[key] = at;
      } else {
        delete merged[key];
      }
    });
    return merged;
  }

  async function resolveThread(key, value) {
    const at = value ? new Date().toISOString() : null;
    pendingResolve.set(key, at);
    resolved = mergeResolved(resolved);
    if (at) {
      resolved[key] = at;
    }
    render();
    try {
      await fetch('resolve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ target: key, resolved: value }) });
    } catch {}
  }

  function flashInto(el) {
    el.scrollIntoView({ block: 'center', behavior: scrollBehavior() });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1200);
  }

  function showChange(thread) {
    const els = changedElements(latestReply(thread)?.reply.lines ?? []);
    if (!els.length) {
      return;
    }
    const i = (showIndex.get(thread.key) ?? 0) % els.length;
    showIndex.set(thread.key, i + 1);
    flashInto(els[i]);
  }

  function flashChange(thread) {
    const el = changedElements(latestReply(thread)?.reply.lines ?? [])[0] ?? anchorFor(thread);
    if (el) {
      flashInto(el);
    }
  }

  function revealUnseenInPanel() {
    const keys = new Set(unseen().map((c) => c.target));
    [...document.querySelectorAll('.panel .thread-item')].find((el) => keys.has(el.dataset.key))?.scrollIntoView({ block: 'nearest' });
  }

  function openThreadInPanel(thread) {
    if (!thread) {
      return;
    }
    markSeen(thread.items.filter((c) => c.reply).map((c) => c.id));
    flashChange(thread);
    panelFocus = thread.key;
    renderPanel();
    togglePanel(true);
  }

  const SEEN_AFTER_MS = 1500;
  const visibleSince = new Map();

  function unfoldUnseen() {
    const keys = unseen().map((c) => c.target).filter((key) => foldedKeys.has(key));
    if (keys.length) {
      keys.forEach((key) => foldedKeys.delete(key));
      try { localStorage.setItem(FOLD_KEY, JSON.stringify([...foldedKeys])); } catch {}
    }
  }

  // Where a reader would notice a reply: its thread in the margin, else what it changed, else its element.
  function seenTarget(c) {
    const card = cards.get(c.target)?.el;
    if (card?.offsetParent && !card.classList.contains('folded')) {
      return card;
    }
    if ($('.panel').classList.contains('open')) {
      return [...document.querySelectorAll('.panel .thread-item')].find((el) => el.dataset.key === c.target) ?? null;
    }
    const thread = threadsOf().find((t) => t.key === c.target);
    return changedElements(c.reply.lines ?? [])[0] ?? (thread && anchorFor(thread)) ?? null;
  }

  function halfVisible(el) {
    const r = el.getBoundingClientRect();
    const shown = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
    return r.height > 0 && shown >= Math.min(r.height, innerHeight) / 2;
  }

  function watchSeen() {
    if (document.visibilityState !== 'visible' || !seenIds) {
      return;
    }
    const now = Date.now();
    const done = unseen().filter((c) => {
      const el = seenTarget(c);
      if (!el) {
        return !inThread(c);
      }
      if (!halfVisible(el)) {
        visibleSince.delete(c.id);
        return false;
      }
      visibleSince.set(c.id, visibleSince.get(c.id) ?? now);
      return now - visibleSince.get(c.id) >= SEEN_AFTER_MS;
    });
    if (done.length) {
      markSeen(done.map((c) => c.id));
    }
  }

  function offscreen() {
    const els = unseen().filter(inThread).map(seenTarget).filter(Boolean);
    return {
      above: els.filter((el) => el.getBoundingClientRect().bottom < 0).sort((a, b) => b.getBoundingClientRect().top - a.getBoundingClientRect().top),
      below: els.filter((el) => el.getBoundingClientRect().top > innerHeight).sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top),
    };
  }

  function renderOffscreen() {
    const found = offscreen();
    const margin = $('.margin');
    const column = margin.offsetParent ? margin.getBoundingClientRect() : null;
    [['above', '↑'], ['below', '↓']].forEach(([side, arrow]) => {
      const note = $(`.offscreen-note.${side}`);
      const n = found[side].length;
      note.hidden = n === 0;
      note.textContent = `${arrow} ${n} new ${n === 1 ? 'reply' : 'replies'} ${side}`;
      note.style.left = column ? `${column.left}px` : '';
      note.classList.toggle('docked', Boolean(column));
    });
  }

  function jumpToUnseen(side) {
    offscreen()[side][0]?.scrollIntoView({ block: 'center', behavior: scrollBehavior() });
  }

  let badges = [];
  let badgeSig = null;

  // A thread that is not in the margin, resolved or on a narrow screen, keeps a counter on its element.
  function renderBadges() {
    const off = threadsOf().filter((t) => t.items.length && (t.resolved || marginHidden())).map((t) => [t, anchorFor(t)]).filter(([, a]) => a);
    const sig = JSON.stringify(off.map(([t]) => [t.key, messagesOf(t).length]));
    if (sig !== badgeSig) {
      badgeSig = sig;
      badges.forEach(([b]) => b.remove());
      badges = off.map(([t, anchor]) => [badge(t), anchor]);
    } else {
      badges = badges.map(([b], i) => [b, off[i][1]]);
    }
    positionBadges();
  }

  function badge(thread) {
    const b = document.createElement('button');
    b.className = 'tbadge';
    b.textContent = `💬 ${messagesOf(thread).length}`;
    b.title = thread.resolved ? 'Resolved thread · open in the panel' : 'Open the thread';
    b.onclick = (e) => {
      e.stopPropagation();
      openThreadInPanel(threadsOf().find((t) => t.key === thread.key));
    };
    document.body.appendChild(b);
    return b;
  }

  function positionBadges() {
    badges.forEach(([b, el]) => {
      const r = el.getBoundingClientRect();
      b.style.left = `${r.right + scrollX - b.offsetWidth + 8 - (el.dataset.cn ? 28 : 0)}px`;
      b.style.top = `${r.top + scrollY - 11}px`;
    });
  }

  function markArrivals(card, isNew) {
    if (marginReady && isNew) {
      card.classList.add('arrive');
    }
    card.querySelectorAll('.msg').forEach((m) => {
      if (marginReady && !isNew && !shownMsgs.has(m.dataset.id)) {
        m.classList.add('arrive');
      }
      shownMsgs.add(m.dataset.id);
    });
  }

  const threadSig = (t) => JSON.stringify([t.items.map((c) => [c.id, c.reply?.text ?? null, c.reply?.lines ?? null]), t.drafts.map((c) => [c.id, c.text]), expandedKeys.has(t.key), foldedKeys.has(t.key)]);

  // A card is rebuilt only when its thread changed, so a poll never restarts an animation or drops hover.
  function renderMargin() {
    const open = threadsOf().filter((t) => (t.items.length || t.drafts.length) && !t.resolved);
    const keys = new Set(open.map((t) => t.key));
    cards.forEach((entry, key) => {
      if (!keys.has(key)) {
        leave(entry);
        cards.delete(key);
      }
    });
    open.forEach((thread) => {
      const sig = threadSig(thread);
      const entry = cards.get(thread.key);
      if (entry?.sig === sig) {
        entry.thread = thread;
        return;
      }
      const el = threadCard(thread);
      markArrivals(el, !entry);
      if (entry) {
        keepTyping(entry.el, el);
        const from = { box: entry.el.getBoundingClientRect(), radius: getComputedStyle(entry.el).borderRadius };
        entry.el.replaceWith(el);
        morph(el, from);
      } else {
        $('.margin').append(el);
      }
      cards.set(thread.key, { sig, el, thread });
    });
    marginReady = true;
    document.querySelectorAll('.margin small[data-at]').forEach((small) => {
      small.textContent = ago(small.dataset.at);
    });
    layoutMargin();
    renderBadges();
    cardSizes.disconnect();
    [...cards.values(), ...leavers.values()].forEach(({ el }) => cardSizes.observe(el));
  }

  const leavers = new Map();

  // A resolved card keeps its place while it slides out, then gives it up as it collapses.
  function leave({ el, thread }) {
    el.classList.remove('arrive');
    el.classList.add('leaving');
    delete el.dataset.key;
    if (el.contains(document.activeElement)) {
      document.activeElement.blur();
    }
    leavers.set(el, { el, thread, full: el.offsetHeight, top: parseFloat(el.style.top) || 0 });
    setTimeout(() => collapse(el), 300);
  }

  function collapse(el) {
    const done = () => {
      leavers.delete(el);
      el.remove();
      layoutMargin();
    };
    if (reducedMotion.matches || !el.offsetHeight) {
      done();
      return;
    }
    el.style.overflow = 'clip';
    el.animate([{ height: `${el.offsetHeight}px` }, { height: '0px', paddingBlock: '0px', borderWidth: '0px' }], { duration: 260, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' }).finished.then(done, done);
  }

  // A collapsing card's height and its gap shrink together, so the card below closes up without a jump at the end.
  const spaceOf = (entry, gap) => {
    const leaver = leavers.get(entry.el);
    return leaver ? (entry.el.offsetHeight * (leaver.full + gap)) / leaver.full - gap : entry.el.offsetHeight;
  };

  const cardHeights = new WeakMap();

  // A rebuilt card eases from its old size to its new one; widening is clipped, not animated, so text never rewraps midway.
  function morph(el, from) {
    const to = { box: el.getBoundingClientRect(), radius: getComputedStyle(el).borderRadius };
    if (reducedMotion.matches || (Math.abs(from.box.height - to.box.height) < 1 && Math.abs(from.box.width - to.box.width) < 1)) {
      return;
    }
    const start = { height: `${from.box.height}px`, borderRadius: from.radius };
    const end = { height: `${to.box.height}px`, borderRadius: to.radius };
    if (to.box.width > from.box.width) {
      start.clipPath = `inset(0 ${to.box.width - from.box.width}px 0 0 round ${from.radius})`;
      end.clipPath = `inset(0 0 0 0 round ${to.radius})`;
    } else {
      start.width = `${from.box.width}px`;
      end.width = `${to.box.width}px`;
    }
    cardHeights.set(el, from.box.height);
    el.style.overflow = 'clip';
    el.animate([start, end], { duration: 300, easing: 'cubic-bezier(.2, .8, .2, 1)' }).finished.then(() => el.style.removeProperty('overflow'), () => {});
  }

  // A card that grows in place (reply row, typing) moves the cards below in the same frame, without the glide lagging behind.
  const cardSizes = new ResizeObserver((entries) => {
    const resized = entries.map(({ target, borderBoxSize }) => {
      const before = cardHeights.get(target);
      cardHeights.set(target, borderBoxSize[0].blockSize);
      return before !== undefined && before !== borderBoxSize[0].blockSize;
    });
    if (resized.some(Boolean)) {
      followMargin();
    }
  });

  function followMargin() {
    const margin = $('.margin');
    margin.classList.add('following');
    layoutMargin();
    requestAnimationFrame(() => margin.classList.remove('following'));
  }

  function keepTyping(from, to) {
    const old = from.querySelector('.tools textarea');
    const next = to.querySelector('.tools textarea');
    if (old && next && old.value) {
      next.value = old.value;
    }
    if (old && next && document.activeElement === old) {
      requestAnimationFrame(() => next.focus());
    }
  }

  function layoutThreads(wanted, heights, gap = 8) {
    let floor = -Infinity;
    return wanted.map((w, i) => {
      const top = Math.max(w, floor);
      floor = top + heights[i] + gap;
      return top;
    });
  }

  function layoutMargin() {
    const margin = $('.margin');
    if (!margin.offsetParent) {
      return;
    }
    const base = margin.getBoundingClientRect();
    const head = parseFloat(getComputedStyle(margin).paddingTop);
    const placed = [...cards.values(), ...leavers.values()].map((entry) => {
      const anchor = entry.top === undefined ? anchorFor(entry.thread) : null;
      const wanted = anchor ? anchor.getBoundingClientRect().top - base.top : entry.top ?? head;
      return { entry, anchor, wanted, order: entry.thread.key === 'document' ? -Infinity : Math.round(wanted), now: parseFloat(entry.el.style.top) || 0 };
    }).sort((a, b) => a.order - b.order || a.now - b.now);
    const tops = layoutThreads(placed.map((p) => p.wanted), placed.map((p) => spaceOf(p.entry, 8)));
    placed.forEach((p, i) => {
      p.entry.el.style.top = `${tops[i]}px`;
    });
    anchors = new Map(placed.filter((p) => p.anchor).map((p) => [p.entry.thread.key, p.anchor]));
    link();
  }

  let linked = [];
  let hoverKey = null;

  function link() {
    linked.forEach((el) => el.classList.remove('linked'));
    linked = [...new Set([hoverKey, selectedKey])].filter(Boolean).flatMap((key) => [cards.get(key)?.el, anchors.get(key)]).filter(Boolean);
    linked.forEach((el) => el.classList.add('linked'));
    cards.forEach(({ el }, key) => el.classList.toggle('selected', key === selectedKey));
  }

  function linkFromHover(e) {
    const card = e.target.closest('.margin .thread');
    const el = card ? null : e.target.closest('[data-ct]');
    hoverKey = card?.dataset.key ?? [...anchors].find(([, a]) => a === el)?.[0] ?? null;
    link();
  }

  const STATUS = {
    listening: { label: 'Agent listening', hint: 'Comments reach the agent as you send them.' },
    copy: { label: 'Offline copy', hint: 'A saved copy: comments stay in this browser and can be copied, not sent.' },
    idle: {
      label: 'Agent not listening',
      hint: 'Comments are saved. Click to see how to resume.',
      help: 'Your comments are saved on this page, but none reach the agent until it listens again. Send this in the agent session:',
      ask: `Pick up the comments on ${DOC} and listen again`,
    },
    offline: {
      label: 'Server stopped',
      hint: 'Nothing can be sent. Click to see how to restart.',
      help: 'The explainer server has stopped, so nothing can be sent. Send this in the agent session:',
      ask: `Restart the explainer for ${DOC}`,
    },
  };

  function showStatus(kind) {
    const el = $('#status');
    el.className = `status ${kind}`;
    el.dataset.kind = kind;
    el.title = skillVersion ? `${STATUS[kind].hint}\nexplaining-visually ${skillVersion}` : STATUS[kind].hint;
    el.firstElementChild.textContent = STATUS[kind].label;
  }

  function showStatusHelp() {
    const { label, help, ask } = STATUS[$('#status').dataset.kind] ?? {};
    if (!ask) {
      return;
    }
    const pop = document.createElement('div');
    pop.className = 'pop status-help';
    pop.innerHTML = '<div class="target"></div><p></p><pre></pre><div class="row"><button data-a="close">Close</button><button data-a="copy" class="primary">Copy</button></div>';
    pop.querySelector('.target').textContent = label;
    pop.querySelector('p').textContent = help;
    pop.querySelector('pre').textContent = ask;
    pop.querySelector('[data-a=close]').onclick = closePop;
    pop.querySelector('[data-a=copy]').onclick = async (e) => {
      try {
        await navigator.clipboard.writeText(ask);
        e.target.textContent = 'Copied';
      } catch {
        getSelection().selectAllChildren(pop.querySelector('pre'));
        e.target.textContent = 'Press ⌘C';
      }
    };
    showPop(pop, $('#status'));
  }

  function showUpdate(state) {
    if (installing) {
      return;
    }
    const button = $('#update');
    button.hidden = !state.update;
    button.disabled = !state.canUpdate;
    button.textContent = `v${state.update} available · Update`;
    button.title = state.canUpdate ? `You have v${state.version}` : 'Update from the computer that runs the server';
  }

  const pause = (ms) => new Promise((done) => setTimeout(done, ms));

  async function serverBack() {
    for (let i = 0; i < 40; i++) {
      await pause(500);
      try {
        if ((await fetch('/health', { cache: 'no-store' })).ok) {
          return;
        }
      } catch {}
    }
  }

  async function installUpdate() {
    const button = $('#update');
    installing = true;
    button.disabled = true;
    button.textContent = 'Updating…';
    try {
      const res = await fetch('/_update', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
      const result = await res.json();
      if (!result.ok) {
        throw new Error(result.error);
      }
      button.textContent = 'Updated · restarting…';
      await pause(1000);
      await serverBack();
      reloadKeepingScroll();
    } catch (err) {
      button.disabled = false;
      button.textContent = 'Update failed · retry';
      button.title = err.message;
    }
  }

  async function poll() {
    try {
      const state = await (await fetch('state', { cache: 'no-store' })).json();
      skillVersion = state.version;
      showStatus(state.listening ? 'listening' : 'idle');
      showUpdate(state);
      if (state.v !== bodyVersion) {
        await updateBody(state.v);
      }
      loadSeen(state.sent);
      sent = state.sent;
      unfoldUnseen();
      resolved = mergeResolved(state.resolved ?? {});
      render();
      motion = true;
    } catch {
      showStatus('offline');
    }
  }

  function showButtonFor(el) {
    clearTimeout(hideTimer);
    if (hot !== el) {
      hot?.classList.remove('hot');
      hot = el;
      hot.classList.add('hot');
    }
    const r = el.getBoundingClientRect();
    const badgeOffset = el.dataset.cn ? 28 : 0;
    cbtn.style.left = `${r.right + scrollX - 13 - badgeOffset}px`;
    cbtn.style.top = `${r.top + scrollY - 13}px`;
    cbtn.classList.add('show');
  }

  function hideButtonSoon() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      hot?.classList.remove('hot');
      hot = null;
      cbtn.classList.remove('show');
    }, 180);
  }

  document.addEventListener('click', (e) => {
    const ref = e.target.closest('.sheet-body code.ref');
    if (ref) {
      showRefInSheet(ref);
      return;
    }
    // A thread card or panel item rebuilt by its own click handler has left the document.
    if (!e.target.isConnected || e.target.closest('.bar, .panel, .pop, nav, .cbtn, .h-cbtn, a, button, dialog, .sheet .ask, .qzone, .margin, .live-stage')) {
      return;
    }
    const el = e.target.closest('[data-ct]');
    const thread = el && threadOn(el);
    if (thread) {
      openElementThread(el, thread);
      return;
    }
    clearSelection();
    if (el) {
      commentOn(el);
    } else if (openPopEl() && !openPopEl().matches('.general')) {
      closePop();
    }
  });

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('.cbtn')) {
      clearTimeout(hideTimer);
      return;
    }
    const el = e.target.closest('[data-ct]');
    if (el && el.tagName !== 'H2' && !el.closest('.pop')) {
      showButtonFor(el);
    } else {
      hideButtonSoon();
    }
  });

  document.addEventListener('keydown', (e) => {
    const typing = e.target.closest?.('textarea, input, [contenteditable]');
    if (KEYS[e.key] && !typing && !e.metaKey && !e.ctrlKey && !e.altKey && !$('dialog.confirm').open) {
      e.preventDefault();
      KEYS[e.key]();
      return;
    }
    if (e.key !== 'Escape' || $('dialog.confirm').open) {
      return;
    }
    if (openPopEl()) {
      closePop();
    } else if (sheetOwner) {
      closeSheet();
    } else if ($('.panel').classList.contains('open')) {
      togglePanel(false);
    } else {
      clearSelection();
    }
  });

  cbtn.innerHTML = ICON;
  cbtn.onmousedown = (e) => e.preventDefault();
  cbtn.onclick = () => { if (hot) { commentOn(hot); } };
  $('#list').onclick = () => {
    if ($('.panel').classList.contains('open')) {
      togglePanel(false);
      return;
    }
    panelFocus = null;
    renderPanel();
    togglePanel(true).then(revealUnseenInPanel);
  };
  $('#status').onclick = showStatusHelp;
  $('#theme').onclick = toggleTheme;
  systemDark.addEventListener('change', showThemeButton);
  systemDark.addEventListener('change', () => syncLives(true));
  reducedMotion.addEventListener('change', () => syncLives(true));
  new MutationObserver(() => syncLives(true)).observe(document.documentElement, { attributeFilter: ['data-theme'] });
  $('.panel .general [data-a=batch]').onclick = () => submitGeneral(false);
  $('.panel .general [data-a=send]').onclick = () => submitGeneral(true);
  $('.panel .general textarea').onkeydown = (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      submitGeneral(true);
    }
  };
  $('.sheet .close').onclick = closeSheet;
  $('.scrim').onclick = () => dismiss(sheetOwner ? $('.sheet') : $('.panel'));
  $('.panel .handle').addEventListener('pointerdown', dragSheet);
  $('.sheet .handle').addEventListener('pointerdown', dragSheet);
  $('.sheet header').addEventListener('pointerdown', dragSheet);
  $('.panel header').addEventListener('pointerdown', dragSheet);
  $('.panel .close').onclick = () => togglePanel(false);
  $('.sheet .tabs').onclick = (e) => {
    const b = e.target.closest('button');
    if (b && sheetOwner) {
      openSheet(sheetOwner, b.dataset.tab);
    }
  };
  $('#send').onclick = sendBatch;
  $('#approve').onclick = requestApproval;
  setInterval(watchSeen, 250);
  addEventListener('scroll', () => requestAnimationFrame(renderOffscreen), { passive: true });
  $('.offscreen-note.above').onclick = () => jumpToUnseen('above');
  $('.offscreen-note.below').onclick = () => jumpToUnseen('below');
  const closeDialog = () => animate('dialog', () => $('dialog.confirm').close());
  $('dialog.confirm [data-a=cancel]').onclick = closeDialog;
  $('dialog.confirm').addEventListener('cancel', (e) => {
    e.preventDefault();
    closeDialog();
  });
  $('dialog.confirm [data-a=ok]').onclick = () => {
    closeDialog();
    approve();
  };
  $('#update').onclick = installUpdate;
  addEventListener('resize', positionPins);
  new ResizeObserver(([entry]) => {
    document.documentElement.style.setProperty('--bar-h', `${Math.ceil(entry.borderBoxSize[0].blockSize)}px`);
    positionPins();
  }).observe($('.bar'));
  document.addEventListener('mouseover', linkFromHover);
  addEventListener('resize', layoutMargin);
  addEventListener('resize', positionBadges);
  document.fonts.ready.then(layoutMargin);
  new ResizeObserver(() => {
    layoutMargin();
    renderBadges();
  }).observe($('main'));

  showThemeButton();
  requestAnimationFrame(() => requestAnimationFrame(() => $('#theme').classList.add('ready')));
  tagTargets();
  collectMores();
  syncLives();
  addLegends();
  setupQuestions();
  addSectionButtons();
  buildToc();
  render();
  restoreScroll();
  restoreSheet();
  if (served) {
    poll();
    setInterval(poll, 2000);
  } else {
    showStatus('copy');
    requestAnimationFrame(() => { motion = true; });
  }
})();
</script>
</body>
</html>
