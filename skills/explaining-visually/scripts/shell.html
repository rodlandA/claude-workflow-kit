<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
@font-face { font-family: "Geist"; src: url("/_fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/_fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: light dark;
  --bg: light-dark(#eee9df, #2c3b4d);
  --card: light-dark(#f7f3ec, #1b2632);
  --oat: light-dark(#e2dacb, #23303f);
  --fg: light-dark(#1b2632, #eee9df);
  --muted: light-dark(#5d6570, #b5ae9f);
  --line: light-dark(#d3cbbb, #435670);
  --accent: light-dark(#a35139, #ffb162);
  --accent-soft: light-dark(#f0dccf, #3d3a3a);
  --on-accent: light-dark(#eee9df, #1b2632);
  --flame: #ffb162; --on-flame: #1b2632;
  --new: light-dark(#e08a2e, #ffb162);
  --new-soft: light-dark(#ffe4c4, #4a3a2a);
  --changed: light-dark(#2c3b4d, #a9bdd4);
  --changed-soft: light-dark(#dcdfe2, #3a5069);
  --removed: light-dark(#a35139, #e8896d);
  --removed-soft: light-dark(#f1d9cc, #4b2e27);
  --note: light-dark(#2c3b4d, #ffb162);
  --note-soft: light-dark(#dcdfe2, #4a3a2a);
  --on-note: light-dark(#eee9df, #1b2632);
  --band-fg: light-dark(#1b2632, #eee9df);
  --band: radial-gradient(90% 120% at 100% 110%, light-dark(rgb(255 177 98 / .6), rgb(255 177 98 / .38)), transparent 60%), radial-gradient(70% 90% at 0% 120%, light-dark(rgb(163 81 57 / .3), rgb(163 81 57 / .45)), transparent 65%), linear-gradient(160deg, light-dark(#eee9df, #1b2632), light-dark(#c9c1b1, #121a23));
  --band-head: light-dark(#a35139, #ffb162);
  --qcard: light-dark(#f7f3ec, #1b2632);
  --page: radial-gradient(80% 70% at 100% 108%, light-dark(rgb(255 177 98 / .5), rgb(255 177 98 / .32)), transparent 70%),
    radial-gradient(45% 55% at 0% 115%, light-dark(rgb(163 81 57 / .3), rgb(163 81 57 / .55)), transparent 70%),
    radial-gradient(70% 50% at 0% 0%, light-dark(rgb(201 193 177 / .5), rgb(27 38 50 / 0)), transparent 70%),
    linear-gradient(160deg, light-dark(#eee9df, #2c3b4d), light-dark(#eee9df, #1b2632));
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body { margin: 0; min-height: 100vh; background-color: var(--bg); background-image: var(--page); background-attachment: fixed; color: var(--fg); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
code { font-family: var(--mono); font-size: .86em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }

.layout { display: grid; grid-template-columns: 230px minmax(0, 920px); gap: 40px; padding: 0 24px; margin-left: max(0px, calc((100% - 1238px) * .3)); }
nav.toc { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; padding: 72px 0 32px; font-size: 13.5px; }
nav.toc a { display: block; color: var(--muted); text-decoration: none; padding: 4px 10px; border-left: 2px solid var(--line); }
nav.toc a.sub { padding-left: 22px; font-size: 12.5px; }
nav.toc a.active { color: var(--fg); border-left: 3px solid var(--accent); padding-left: 9px; font-weight: 600; }
main { padding: 96px 0 120px; min-width: 0; }

h1 { font-size: 38px; font-weight: 650; line-height: 1.1; margin: 0 0 10px; letter-spacing: -.03em; }
h1[data-mode]::before { content: attr(data-mode); display: table; margin-bottom: 14px; font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; background: var(--flame); color: var(--on-flame); }
.lede { color: var(--muted); font-size: 18px; margin: 0 0 32px; max-width: 70ch; }
section { margin: 0 0 56px; }
nav.toc .keys { margin-top: 18px; padding-left: 12px; font-size: 12px; color: var(--muted); }
nav.toc kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--card); }
.layout { transition: grid-template-columns .25s cubic-bezier(.3, 0, .8, .15), gap .25s cubic-bezier(.3, 0, .8, .15); }
nav.toc { transition: opacity .2s; }
main { counter-reset: sec; }
section > h2 { counter-increment: sec; font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 16px; padding-top: 14px; border-top: 1px solid var(--line); }
section > h2::before { content: counter(sec, decimal-leading-zero); display: block; margin-bottom: 4px; font: 500 12px var(--mono); letter-spacing: .08em; color: var(--accent); }
h3 { font-size: 16px; margin: 22px 0 8px; }
p { max-width: 72ch; }

.tldr { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; padding: 0; list-style: none; margin: 0 0 40px; }
.tldr li { background: var(--oat); border-radius: 12px; padding: 16px 18px; }
.tldr li b { font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.tldr li b { display: block; }

.flow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
.flow.v { flex-direction: column; align-items: flex-start; }
.flow.v > .box, .flow.v > .arrow { width: min(480px, 100%); }
.col .flow.v > .box, .col .flow.v > .arrow { width: 100%; }
.flow.v > .col { width: fit-content; max-width: 100%; }
.flow.v > .col > .flow { display: flex; flex-wrap: wrap; gap: 8px; }
.flow.v > .col > .flow > .box { width: 230px; max-width: 100%; }
.flow:not(.v):not(:has(> .arrow)) { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; align-items: stretch; }
.col > .flow { margin: 10px 0 0; }
.col > h4 + .flow { margin-top: 0; }
.box { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; overflow-wrap: anywhere; }
.box code { max-width: 100%; }
.box b { display: block; font-size: 14px; }
.box small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.box code { display: inline-block; margin-top: 4px; font-size: 11px; }
.box.new, .step.new { border-color: var(--new); background: var(--new-soft); }
.box.changed, .step.changed { border-color: var(--changed); background: var(--changed-soft); }
.box.removed, .step.removed { border-color: var(--removed); background: var(--removed-soft); }
.box.removed b { text-decoration: line-through; text-decoration-color: var(--removed); }
.box.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.arrow { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 11.5px; min-width: 44px; text-align: center; }
.arrow::after { content: "\2192"; font-size: 20px; line-height: 1; }
.flow.v .arrow::after { content: "\2193"; }
.arrow:empty::after { margin-top: 0; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 16px 0; }
.col { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.col > h4 code { text-transform: none; }
.col > h4 { margin: 0 0 8px; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 12px var(--mono); color: var(--muted); margin: 4px 0 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1.5px solid var(--line); }
.legend .new::before { border-color: var(--new); background: var(--new-soft); }
.legend .changed::before { border-color: var(--changed); background: var(--changed-soft); }
.legend .removed::before { border-color: var(--removed); background: var(--removed-soft); }

ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 16px 0; display: grid; gap: 10px; }
.step { counter-increment: s; position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 12px 52px; }
.step::before { content: counter(s); position: absolute; left: 14px; top: 11px; width: 26px; height: 26px; border-radius: 50%; background: light-dark(#1b2632, #ffb162); color: light-dark(#ffb162, #1b2632); font: 600 12px var(--mono); display: grid; place-items: center; }
.step b { display: block; }
.step small { color: var(--muted); }

.callout { border-left: 4px solid var(--accent); background: var(--card); border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 14px 0; }
.callout > b:first-child { display: block; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.callout.trap { border-color: var(--removed); } .callout.trap > b:first-child { color: var(--removed); }
.callout.decision { border-color: var(--note); } .callout.decision > b:first-child { color: var(--note); }
.callout.question { border-color: var(--changed); } .callout.question > b:first-child { color: var(--changed); }

table.files { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.files td, table.files th { overflow-wrap: anywhere; text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
table.files th { background: var(--oat); font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 0; }

main aside.more, main .q { display: none; }
.qzone { background: var(--band); color: var(--band-fg); border: 1px solid light-dark(#c9c1b1, transparent); border-radius: 20px; padding: 18px 18px 18px; margin: 0 0 48px; }
.qzone > .qz-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 0 2px 12px; }
.qzone > .qz-head b { color: var(--band-head); }
.qzone > .qz-head span { opacity: .8; }
.qcard, details.qa { color: var(--fg); }
.qzone > .qz-head b { white-space: nowrap; font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.qzone > .qz-head span { font-size: 13px; }
.qzone:not(:has(.qcard)) > .qz-head { margin-bottom: 8px; }
.qcard { background: var(--qcard); border: 0; border-radius: 14px; padding: 16px 18px; }
.qcard + details.qa { margin-top: 12px; }
.draft-note { display: inline-flex; align-items: center; gap: 8px; margin: -20px 0 32px; padding: 4px 12px; border-radius: 99px; font: 12.5px var(--mono); color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent); }
.qcard .qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.qcard .qhead button { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; padding: 3px 10px; color: var(--muted); }
.qcard > b { display: block; font-size: 17px; line-height: 1.35; }
.qcard > small { display: block; color: var(--muted); margin-top: 2px; }
.qcard .opts { display: grid; gap: 8px; margin: 12px 0 0; }
.qzone .qcard .opt { display: block; width: 100%; text-align: left; font-size: 14px; padding: 10px 14px; border-width: 1.5px; border-radius: 10px; background: var(--bg); }
.qcard .opt small { display: block; color: var(--muted); font-size: 12.5px; }
.qcard .opt em { float: right; margin-left: 8px; font: normal 500 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.qzone .qcard .opt.on { border-color: var(--new); background: var(--new-soft); }
.qcard textarea { margin-top: 10px; width: 100%; min-height: 64px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--fg); resize: vertical; }
.qcard .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.qzone button:disabled { opacity: .45; cursor: default; }
details.qa { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
details.qa summary { cursor: pointer; padding: 10px 16px; font-size: 13.5px; font-weight: 600; }
details.qa .qa-item { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 14px; }
details.qa .qa-item > b { display: block; }
details.qa .qa-item .a { color: var(--note); margin-top: 2px; white-space: pre-wrap; }
details.qa .qa-item .reply { margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: var(--new-soft); font-size: 13.5px; white-space: pre-wrap; }
details.qa .qa-item .wait { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
details.qa .qa-item button { float: right; font-size: 12.5px; padding: 3px 10px; }
.more pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; }
.has-more:not(tr, svg *) { position: relative; }
.has-more:not(tr, svg *)::before { content: "i"; position: absolute; left: -7px; top: -7px; z-index: 1; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: italic 700 11px/16px Georgia, serif; text-align: center; }
tr.has-more > td:first-child { box-shadow: inset 3px 0 var(--accent); }
.sheet-owner { outline: 2px solid var(--accent); outline-offset: 3px; }

figure { margin: 16px 0; }
figure svg { max-width: 100%; height: auto; }
figcaption { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
svg text { fill: var(--fg); font: 13px var(--sans); }
svg .muted { fill: var(--muted); }
svg .node { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
svg .edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }

/* Comment layer */
.bar { animation: bar-in .2s ease-out; position: fixed; top: 16px; right: 16px; width: auto; max-width: calc(100vw - 32px); z-index: 50; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; padding: 10px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.10); }
.bar .status { margin-right: auto; }
.bar button.theme { order: -1; position: relative; flex: none; width: 52px; height: 28px; padding: 0; border-radius: 99px; background: var(--oat); border: 1px solid var(--line); }
.bar button.theme:hover { border-color: var(--accent); }
.theme .knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--flame); color: var(--on-flame); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.theme svg { grid-area: 1 / 1; }
.theme .moon, .theme[aria-checked="true"] .sun { opacity: 0; transform: rotate(-90deg) scale(.4); }
.theme[aria-checked="true"] .sun { transform: rotate(90deg) scale(.4); }
.theme[aria-checked="true"] .moon { opacity: 1; transform: none; }
.theme[aria-checked="true"] .knob { transform: translateX(24px); background: #eee9df; color: #2c3b4d; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .5s; animation-timing-function: ease-in-out; }
.theme .knob { view-transition-name: theme-knob; }
::view-transition-group(theme-knob) { animation-duration: .5s; animation-timing-function: cubic-bezier(.05, .7, .1, 1); }
.theme.ready .knob { transition: transform .4s cubic-bezier(.05, .7, .1, 1), background-color .4s; }
.theme.ready svg { transition: transform .4s cubic-bezier(.05, .7, .1, 1), opacity .25s; }
.bar .status { order: -2; }
.bar .actions { display: flex; gap: 8px; }
.bar .actions button { flex: 1 1 auto; white-space: nowrap; }
body.sheet-open .bar, body:has(.panel.open:not(.leaving)) .bar, body.leaving .bar { top: 0; right: 0; width: var(--sheet-w); max-width: 100vw; border-right: 0; border-radius: 16px 0 0 0; box-shadow: none; animation: sheet-in var(--enter); }
body.leaving .bar { animation: sheet-out var(--exit); }
body.sheet-open .bar .actions, body:has(.panel.open:not(.leaving)) .bar .actions, body.leaving .bar .actions { width: 100%; }
@keyframes bar-in { from { opacity: 0; } }
.bar button, .pop button, .panel button, .qzone button { font: inherit; font-size: 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 6px 12px; cursor: pointer; }
.bar button.send { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.bar button:disabled { opacity: .45; cursor: default; }
.status { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); white-space: nowrap; }
.status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.listening::before { background: var(--new); }
.status.idle { color: var(--note); border-color: var(--note); }
.status.idle::before { background: var(--note); }
.status.offline { color: var(--removed); border-color: var(--removed); }
.status.offline::before { background: var(--removed); }
.status.idle, .status.offline { cursor: pointer; }
.pop.status-help p { margin: 0; font-size: 13.5px; }
.pop.status-help pre { margin: 8px 0 0; padding: 8px; white-space: pre-wrap; font: 13px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.cbtn, .h-cbtn { border: 1px solid var(--line); background: var(--card); color: var(--note); border-radius: 50%; padding: 0; place-items: center; cursor: pointer; }
.cbtn { position: absolute; z-index: 45; width: 26px; height: 26px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.14); }
.cbtn.show { display: grid; }
.h-cbtn { display: inline-grid; width: 26px; height: 26px; margin-left: 10px; vertical-align: 2px; color: var(--muted); }
section:hover .h-cbtn { color: var(--note); }
.cbtn:hover, .h-cbtn:hover { background: var(--note); border-color: var(--note); color: var(--on-note); }
[data-ct].hot { outline: 1.5px dashed var(--note); outline-offset: 3px; }
[data-cn] { outline: 2px solid var(--note); outline-offset: 3px; position: relative; }
[data-cn]:not(svg *)::after { content: attr(data-cn); position: absolute; top: -10px; right: -10px; background: var(--note); color: var(--on-note); font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 5px; }
svg [data-cn]:is(rect, circle, ellipse, path, polygon), svg [data-cn] > :is(rect, circle, ellipse, path, polygon) { stroke: var(--note); stroke-width: 2.5; }
svg [data-ct].hot:is(rect, circle, ellipse, path, polygon), svg [data-ct].hot > :is(rect, circle, ellipse, path, polygon) { stroke: var(--note); stroke-dasharray: 4 3; }
.flash { animation: flash 1.2s; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 6px var(--note-soft); } }
.c-sent { outline: 1.5px dotted var(--muted); outline-offset: 3px; }
.loader { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; flex: none; background: conic-gradient(var(--accent), var(--note), var(--removed), var(--changed), var(--new), var(--accent)); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); animation: spin .9s linear infinite; }
h2 > .loader { width: 18px; height: 18px; margin-left: 10px; vertical-align: 1px; }
nav.toc a .loader { width: 10px; height: 10px; margin-left: 6px; vertical-align: 0; }
.loader.pin { position: absolute; z-index: 40; }
@keyframes spin { to { transform: rotate(1turn); } }
@media (prefers-reduced-motion: reduce) { .loader { animation-duration: 3s; } }
.delta { outline: 2px solid var(--new); outline-offset: 3px; box-shadow: 0 0 0 6px var(--new-soft); }
svg .delta > :is(rect, circle, ellipse, path, polygon) { stroke: var(--new); stroke-width: 2.5; }
.bar button.changes { border-color: var(--new); color: var(--new); }
.bar button.reload { border-color: var(--accent); color: var(--accent); }
.bar button.pulse { border-color: var(--note); color: var(--note); }
.pop { position: absolute; z-index: 60; width: min(380px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.pop.general { position: fixed; left: 50% !important; top: 14vh !important; transform: translateX(-50%); width: min(680px, calc(100vw - 32px)); padding: 18px; }
.pop .target { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.pop.general .target { font-size: 15px; font-weight: 600; color: var(--fg); }
.pop q { display: block; font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin-bottom: 8px; }
.pop textarea { width: 100%; min-height: 84px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--fg); resize: vertical; }

/* Modal side sheet (Material 3), attached to the trailing edge; the bar is its top */
:root { --sheet-w: clamp(360px, 40vw, 640px); --bar-h: 56px; --enter: .4s cubic-bezier(.05, .7, .1, 1); --exit: .25s cubic-bezier(.3, 0, .8, .15) forwards; }
.sheet { position: fixed; top: 0; padding-top: var(--bar-h); right: 0; bottom: 0; width: var(--sheet-w); max-width: 100vw; z-index: 44; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-right: 0; border-radius: 16px 0 0 16px; overflow: hidden; box-shadow: 0 10px 36px rgba(0,0,0,.16); animation: sheet-in var(--enter); }

.sheet .sheet-body code.ref:hover { background: var(--accent); color: var(--bg); }
.sheet .flow:has(> .arrow) { flex-direction: column; align-items: stretch; }
.sheet .flow:has(> .arrow) > .arrow::after { content: "\2193"; }
.sheet .ask { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.sheet .ask:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.sheet .ask p { margin: 0 0 8px; color: var(--muted); font-size: 13.5px; }
.sheet .ask textarea { width: 100%; min-height: 64px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--fg); resize: vertical; }
.sheet .ask .row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }

@media (min-width: 840px) { body.sheet-open, body:has(.panel.open:not(.leaving)) { padding-right: var(--sheet-w); } }
@media (min-width: 840px) and (max-width: 1099px) {
  body.sheet-open .layout, body:has(.panel.open:not(.leaving)) .layout { grid-template-columns: 0 minmax(0, 920px); gap: 0; transition-duration: .4s; transition-timing-function: cubic-bezier(.05, .7, .1, 1); }
  body.sheet-open nav.toc, body:has(.panel.open:not(.leaving)) nav.toc { opacity: 0; visibility: hidden; }
}
.sheet .handle, .panel .handle { display: none; justify-content: center; align-items: center; height: 48px; flex: none; cursor: grab; touch-action: none; }
.sheet .handle::before, .panel .handle::before { content: ''; width: 32px; height: 4px; border-radius: 2px; background: var(--muted); opacity: .5; }

@keyframes sheet-up { from { transform: translateY(48px); opacity: 0; } }

.codes .head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 4px; }

.panel .general { padding: 4px 16px 14px; border-bottom: 1px solid var(--line); }

.bar button.on { border-color: var(--accent); color: var(--accent); }

.bar .approved { flex: 1 1 auto; display: inline-flex; justify-content: center; align-items: center; font-size: 13px; padding: 6px 12px; border-radius: 8px; color: var(--new); background: var(--new-soft); border: 1px solid var(--new); white-space: nowrap; }
dialog.confirm { width: min(440px, calc(100vw - 32px)); padding: 24px; border: 1px solid var(--line); border-radius: 28px; background: var(--card); color: var(--fg); box-shadow: 0 10px 36px rgba(0,0,0,.2); }
dialog.confirm::backdrop { background: rgba(0,0,0,.32); }
dialog.confirm h3 { margin: 0 0 12px; font-size: 20px; }
dialog.confirm ul { margin: 0 0 12px; padding-left: 20px; }
dialog.confirm p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

dialog.confirm button.primary { background: var(--flame); color: var(--on-flame); border-color: var(--flame); font-weight: 600; }
.panel { animation: sheet-in var(--enter); position: fixed; top: 0; padding-top: var(--bar-h); right: 0; bottom: 0; width: var(--sheet-w); max-width: 100vw; z-index: 44; background: var(--card); border: 1px solid var(--line); border-right: 0; border-radius: 16px 0 0 16px; overflow: hidden; box-shadow: 0 10px 36px rgba(0,0,0,.16); display: none; flex-direction: column; }
.panel.open { display: flex; }
.panel .list { overflow: auto; padding: 8px; flex: 1; }

.panel .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.panel .item.draft { cursor: pointer; }
.panel .item .t { font-size: 12px; color: var(--note); font-weight: 600; }
.panel .item .x { float: right; border: 0; padding: 0 4px; background: none; color: var(--muted); }
.panel .item .chip { float: right; font-size: 11px; color: var(--muted); }

.panel .empty { color: var(--muted); font-size: 13px; padding: 8px 6px; }
/* Compact and medium windows: modal bottom sheets, measurements from the Material 3 spec */
@media (max-width: 839px) {
  .bar button { padding: 5px 10px; }
  .bar .actions { width: 100%; }
  .bar, body.sheet-open .bar, body:has(.panel.open:not(.leaving)) .bar, body.leaving .bar { animation: none; top: 0; right: 0; width: 100%; max-width: none; padding: 8px 16px; border-width: 0 0 1px; border-radius: 0; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  .sheet, .panel { top: auto; bottom: 0; padding-top: 0; left: 0; right: 0; margin: 0 auto; width: min(100%, 640px); max-width: none; height: 60dvh; max-height: calc(100dvh - 72px); z-index: 60; border: 1px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 28px rgba(0,0,0,.18); animation: sheet-up .25s ease-out; transition: height .2s ease, transform .2s ease; }
  .sheet.full, .panel.full { height: calc(100dvh - 72px); }
  .sheet.dragging, .panel.dragging { transition: none; }
  .sheet .handle, .panel .handle { display: flex; }
  .sheet header { padding-top: 0; touch-action: none; }
  .sheet .sheet-body, .panel .list { overscroll-behavior: contain; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }

}
@media (min-width: 641px) and (max-width: 839px) {

@media (max-width: 860px) {
  nav.toc .keys { display: none; }
  html { scroll-padding-top: calc(var(--bar-h) + 16px); }
  .layout { grid-template-columns: 1fr; gap: 0; padding: 0 16px; }
  nav.toc { position: static; max-height: none; padding: calc(var(--bar-h) + 24px) 0 0; }
  main { padding-top: 24px; }
  .flow { flex-direction: column; align-items: stretch; }

}

  body, .layout, nav.toc { transition: none !important; }
}

</style>

<body>
<div class="bar">
  <span class="status" id="status"><span>Connecting…</span></span>
  <button id="theme" class="theme" role="switch" aria-checked="false"><span class="knob"><svg class="sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span></button>
  <span class="loader" id="general-loader" title="The agent is working on a general comment" hidden></span>
  <button id="changes" class="changes" title="Jump to the next change" hidden></button>
  <button id="clear-changes" class="changes" title="Mark changes as seen" hidden>&#x2715;</button>
  <button id="reload" class="reload" hidden>New version · reload</button>
  <div class="actions">
    <button id="list">Comments</button>
    <button id="send" class="send" disabled>Send batch</button>
    <button id="approve" class="approve" hidden>Approve plan</button>
    <span id="approved" class="approved" hidden></span>
  </div>
</div>
<div class="layout">
  <nav class="toc" aria-label="Contents"></nav>
  <main>
{{BODY}}
  </main>
</div>
<aside class="panel">
  <div class="handle" title="Drag to resize or close"></div>
  <div class="general">
    <h5>General comment</h5>
    <textarea placeholder="The bigger picture: direction, scope, what is missing, what to cut…"></textarea>
    <div class="row"><button data-a="batch">Add to batch</button><button data-a="send" class="primary">Send now ⌘↵</button></div>
  </div>
  <div class="list"></div>
</aside>
<div class="scrim"></div>
<aside class="sheet" hidden aria-label="Details">
  <div class="handle" title="Drag to resize or close"></div>
  <header><div class="title"></div><button class="close" title="Close (Esc)">&#x2715;</button></header>
  <nav class="tabs"><button data-tab="info">Info</button><button data-tab="code">Code</button></nav>
  <div class="sheet-body"></div>
</aside>
<dialog class="confirm">
  <h3>Approve with open items?</h3>
  <ul></ul>
  <p>Approving tells the agent to go ahead with the plan as this page shows it now. Open items are not sent with it.</p>
  <div class="row"><button data-a="cancel">Cancel</button><button data-a="ok" class="primary">Approve anyway</button></div>
</dialog>
<button class="cbtn" title="Comment"></button>
<script>
(() => {
  const DOC = '{{DOC}}';
  const KEY = `explainer:${DOC}`;
  const SCROLL_KEY = `${KEY}:scroll`;
  const BASE_KEY = `${KEY}:base`;
  const SHEET_KEY = `${KEY}:sheet`;
  const compact = matchMedia('(max-width: 839px)');
  const RENDERED = '{{VERSION}}';
  const TARGETS = 'main h2, main h3, .tldr li, .box, .step, .callout, .col, table.files tr, figure, main p, main li, [data-c]';
  const ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
  const REF = /[\w@./-]*\w\.(?:tsx?|jsx?|mjs|cjs|cs|csproj|py|go|rs|java|kt|swift|rb|php|md|json|ya?ml|sh|css|scss|html|sql|toml|xml)(?::\d+(?:-\d+)?)?(?![\w.])/g;
  const $ = (s) => document.querySelector(s);
  const served = location.protocol.startsWith('http');
  const cbtn = $('.cbtn');

  let drafts = [];
  let sent = [];
  let version = null;
  let pendingReload = false;
  let seenReplies = null;
  const SEEN_KEY = `${KEY}:seen`;
  const BASE_TITLE = document.title;
  const DOT = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%233d7a55'/%3E%3C/svg%3E";

  function showUnseen(replies) {
    let seen = replies;
    try {
      seen = Number(sessionStorage.getItem(SEEN_KEY) ?? replies);
      if (!document.hidden) {
        seen = replies;
      }
      sessionStorage.setItem(SEEN_KEY, String(seen));
    } catch {}
    const unseen = Math.max(0, replies - seen);
    document.title = unseen ? `(${unseen}) ${BASE_TITLE}` : BASE_TITLE;
    $('link[rel=icon]').href = unseen ? DOT : 'data:,';
  }
  let deltas = [];
  let deltaIndex = 0;
  let hot = null;
  let hideTimer = null;
  let sheetOwner = null;
  let sheetTab = 'info';
  let sheetRefs = null;
  let sheetWaiting = null;
  const mores = new Map();
  const questions = [...document.querySelectorAll('main .q[id]')];
  const skipped = new Set();
  let reopened = null;
  let shownQuestion;
  let logSig = null;

  try { drafts = JSON.parse(localStorage.getItem(KEY)) || []; } catch { drafts = []; }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(drafts)); } catch {} };
  const newId = () => `c${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;

  const tidy = (text) => text.trim().replace(/\s+/g, ' ').slice(0, 70);
  const labelOf = (el) => {
    if (el.dataset.c) {
      return el.dataset.c;
    }
    if (el.tagName === 'FIGURE') {
      return tidy(el.querySelector('svg')?.getAttribute('aria-label') ?? el.querySelector('figcaption')?.textContent ?? 'Figure');
    }
    return tidy((el.querySelector('b') || el).textContent);
  };

  function sectionOf(el) {
    const s = el.closest('section');
    const h = s && s.querySelector('h2');
    return h ? h.textContent.trim() : '';
  }

  function tagTargets() {
    const seen = new Map();
    document.querySelectorAll(TARGETS).forEach((el) => {
      if (el.closest('.q') || el.parentElement.closest('[data-ct]:is(.box, .step, .callout, .tldr li, tr)')) {
        return;
      }
      const base = el.matches('section > h2') ? sectionOf(el) : `${sectionOf(el)} › ${labelOf(el)}`;
      const n = (seen.get(base) || 0) + 1;
      seen.set(base, n);
      el.dataset.ct = n > 1 ? `${base} (${n})` : base;
    });
  }

  function addSectionButtons() {
    document.querySelectorAll('main section > h2[data-ct]').forEach((h) => {
      const b = document.createElement('button');
      b.className = 'h-cbtn';
      b.title = 'Comment on this section';
      b.innerHTML = ICON;
      b.onclick = (e) => { e.stopPropagation(); commentOn(h); };
      h.appendChild(b);
    });
  }

  function buildToc() {
    const toc = $('nav.toc');
    const anchors = [];
    document.querySelectorAll('main section > h2, main section h3').forEach((h, i) => {
      const section = h.closest('section');
      const anchor = h.tagName === 'H2' && section.id ? section : h;
      if (!anchor.id) {
        anchor.id = `h-${i}`;
      }
      anchors.push(anchor);
      const a = document.createElement('a');
      a.href = `#${anchor.id}`;
      a.textContent = h.textContent;
      a.className = h.tagName === 'H3' ? 'sub' : '';
      toc.appendChild(a);
    });
    const links = [...toc.querySelectorAll('a')];
    const spy = new IntersectionObserver((entries) => {
      entries.filter((e) => e.isIntersecting).forEach((e) => {
        links.forEach((a) => a.classList.toggle('active', a.hash === `#${e.target.id}`));
      });
    }, { rootMargin: '0px 0px -70% 0px' });
    anchors.forEach((el) => spy.observe(el));
    toc.insertAdjacentHTML('beforeend', '<div class="keys"><kbd>j</kbd> <kbd>k</kbd> section · <kbd>c</kbd> comment</div>');
  }

  const sectionsOf = () => [...document.querySelectorAll('main section[id]')];
  const landing = () => parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) + 8;

  function currentSection() {
    return sectionsOf().filter((sec) => sec.getBoundingClientRect().top <= landing()).pop() ?? null;
  }

  function jumpSection(step) {
    const sections = sectionsOf();
    const next = sections[sections.indexOf(currentSection()) + step];
    next?.scrollIntoView({ behavior: reducedMotion.matches ? 'auto' : 'smooth', block: 'start' });
  }

  function commentByKey() {
    const el = hot ?? (currentSection() ?? sectionsOf()[0])?.querySelector('h2');
    if (el) {
      commentOn(el);
    }
  }

  const KEYS = { j: () => jumpSection(1), k: () => jumpSection(-1), c: commentByKey };

  const THEME_KEY = 'explainer:theme';
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => (document.documentElement.dataset.theme ?? (systemDark.matches ? 'dark' : 'light')) === 'dark';

  function showThemeButton() {
    $('#theme').setAttribute('aria-checked', String(isDark()));
    $('#theme').title = isDark() ? 'Dark theme · switch to light' : 'Light theme · switch to dark';
  }

  function toggleTheme() {
    const next = isDark() ? 'light' : 'dark';
    const apply = () => {
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem(THEME_KEY, next); } catch {}
      showThemeButton();
    };
    if (!document.startViewTransition || reducedMotion.matches) {
      apply();
      return;
    }
    // The view transition slides the knob; its own CSS transition would move it a second time.
    $('#theme').classList.remove('ready');
    document.startViewTransition(apply).finished.finally(() => $('#theme').classList.add('ready'));
  }

  // An aside.more expands the element right before it, or the [data-c] it names in data-for.
  function collectMores() {
    document.querySelectorAll('main aside.more').forEach((aside) => {
      const named = aside.dataset.for && aside.closest('section')?.querySelector(`[data-c="${CSS.escape(aside.dataset.for)}"]`);
      const owner = named || aside.previousElementSibling;
      if (owner) {
        mores.set(owner, aside);
        owner.classList.add('has-more');
      }
    });
  }

  function ownerOf(el) {
    const aside = el.closest('aside.more');
    if (!aside) {
      return el;
    }
    const entry = [...mores].find(([, a]) => a === aside);
    return entry ? entry[0] : el;
  }

  const findTarget = (ct) => [...document.querySelectorAll('[data-ct]')].find((el) => el.dataset.ct === ct);
  const targetName = (c) => (c.target === 'document' ? 'General' : c.target);

  function markTargets() {
    document.querySelectorAll('[data-cn]').forEach((el) => el.removeAttribute('data-cn'));
    document.querySelectorAll('.c-sent').forEach((el) => el.classList.remove('c-sent'));
    drafts.forEach((c, i) => {
      const el = findTarget(c.target);
      if (el) {
        el.dataset.cn = el.dataset.cn ? `${el.dataset.cn},${i + 1}` : `${i + 1}`;
      }
    });
    sent.filter((c) => !c.reply).forEach((c) => findTarget(c.target)?.classList.add('c-sent'));
    markWorking();
  }

  function loader(title) {
    const span = document.createElement('span');
    span.className = 'loader';
    span.title = title;
    return span;
  }

  let workingSig = null;

  let pins = [];

  function positionPins() {
    pins.forEach(([pin, el]) => {
      const r = el.getBoundingClientRect();
      pin.style.left = `${r.right + scrollX - 22}px`;
      pin.style.top = `${r.top + scrollY + 8}px`;
    });
  }

  function markWorking() {
    const waiting = sent.filter((c) => !c.reply);
    const sig = waiting.map((c) => c.id).join();
    if (sig === workingSig) {
      return;
    }
    workingSig = sig;
    document.querySelectorAll('main .loader, nav.toc .loader, .loader.pin').forEach((l) => l.remove());
    pins = [];
    $('#general-loader').hidden = !waiting.some((c) => c.target === 'document');
    const sections = new Set();
    waiting.forEach((c) => {
      const found = findTarget(c.target);
      if (!found) {
        return;
      }
      const el = ownerOf(found);
      const title = 'The agent is working on this';
      if (el.matches('section > h2')) {
        if (!el.querySelector('.loader')) {
          el.appendChild(loader(title));
        }
      } else {
        const pin = loader(title);
        pin.classList.add('pin');
        document.body.appendChild(pin);
        pins.push([pin, el]);
      }
      const section = el.closest('section');
      if (section && !sections.has(section)) {
        sections.add(section);
        const id = section.id || section.querySelector('h2')?.id;
        document.querySelector(`nav.toc a[href="#${id}"]`)?.appendChild(loader('The agent is working in this section'));
      }
    });
    positionPins();
  }


  function panelItem(c, cls) {
    const item = document.createElement('div');
    item.className = `item ${cls}`;
    item.innerHTML = '<span class="chip"></span><div class="t"></div><q></q><div class="b"></div><div class="reply"></div>';
    const titles = { expand: `Expand · ${targetName(c)}`, approve: 'Plan approved', answer: `Answer · ${c.quote}` };
    item.querySelector('.t').textContent = titles[c.kind] ?? targetName(c);
    item.querySelector('q').textContent = c.quote || '';
    item.querySelector('q').hidden = !c.quote || c.kind === 'answer';
    item.querySelector('.b').textContent = c.kind === 'answer' ? answerText(c) : c.text || (c.kind === 'expand' ? 'Expand this' : '');
    item.querySelector('.reply').textContent = c.reply ? c.reply.text : '';
    item.querySelector('.reply').hidden = !c.reply;
    return item;
  }

  function renderPanel() {
    const list = $('.panel .list');
    list.innerHTML = '<h5>Unsent</h5>';
    if (!drafts.length) {
      list.insertAdjacentHTML('beforeend', '<div class="empty">Nothing waiting. "Add to batch" collects comments here.</div>');
    }
    drafts.forEach((c, i) => {
      const item = panelItem(c, 'draft');
      item.querySelector('.chip').outerHTML = '<button class="x" title="Delete">✕</button>';
      item.querySelector('.x').onclick = (e) => { e.stopPropagation(); drafts.splice(i, 1); persist(); render(); };
      item.onclick = () => editDraft(i);
      list.appendChild(item);
    });
    list.insertAdjacentHTML('beforeend', '<h5>Sent</h5>');
    if (!sent.length) {
      list.insertAdjacentHTML('beforeend', '<div class="empty">Nothing sent yet.</div>');
    }
    [...sent].reverse().forEach((c) => {
      const item = panelItem(c, c.reply ? 'answered' : 'waiting');
      item.querySelector('.chip').textContent = c.reply ? 'answered' : 'waiting';
      list.appendChild(item);
    });
  }

  const answerOf = (q) => sent.filter((c) => c.kind === 'answer' && c.qid === q.id).pop();
  const questionText = (q) => tidy(q.querySelector('b')?.textContent ?? q.id);
  const optionLabel = (li) => [...li.childNodes].filter((n) => n.nodeName !== 'SMALL').map((n) => n.textContent).join('').trim();
  const answerText = (c) => [c.choice, c.text].filter(Boolean).join(' — ');

  function nextQuestion() {
    const open = questions.filter((q) => !answerOf(q));
    return reopened ?? open.find((q) => !skipped.has(q.id)) ?? open[0] ?? null;
  }

  function questionCard(q) {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = '<div class="qhead"><span></span><button data-a="skip">Skip for now</button></div><b></b><small></small><div class="opts"></div><textarea></textarea><div class="row"><button data-a="cancel">Keep answer</button><button data-a="send" class="primary" disabled>Send answer ⌘↵</button></div>';
    const answered = questions.filter((x) => answerOf(x)).length;
    card.querySelector('.qhead span').textContent = q === reopened ? 'Change your answer' : `Question ${answered + 1} of ${questions.length}`;
    card.querySelector('[data-a=skip]').hidden = q === reopened || questions.filter((x) => !answerOf(x)).length < 2;
    card.querySelector('[data-a=cancel]').hidden = q !== reopened;
    card.querySelector('b').textContent = q.querySelector('b')?.textContent ?? q.id;
    const context = q.querySelector(':scope > small');
    card.querySelector('small').textContent = context?.textContent ?? '';
    card.querySelector('small').hidden = !context;
    const previous = answerOf(q);
    const ta = card.querySelector('textarea');
    const send = card.querySelector('[data-a=send]');
    const chosen = () => card.querySelector('.opt.on')?.dataset.label ?? '';
    const sync = () => { send.disabled = !chosen() && !ta.value.trim(); };
    q.querySelectorAll('li').forEach((li) => {
      const opt = document.createElement('button');
      opt.className = 'opt';
      opt.dataset.label = optionLabel(li);
      opt.append(opt.dataset.label);
      if (li.classList.contains('rec')) {
        opt.insertAdjacentHTML('afterbegin', '<em>Recommended</em>');
      }
      const detail = li.querySelector('small');
      if (detail) {
        opt.appendChild(document.createElement('small')).textContent = detail.textContent;
      }
      opt.classList.toggle('on', previous?.choice === opt.dataset.label);
      opt.onclick = () => {
        const on = !opt.classList.contains('on');
        card.querySelectorAll('.opt').forEach((o) => o.classList.remove('on'));
        opt.classList.toggle('on', on);
        sync();
      };
      card.querySelector('.opts').appendChild(opt);
    });
    card.querySelector('.opts').hidden = !card.querySelector('.opt');
    ta.placeholder = card.querySelector('.opt') ? 'Or answer in your own words, or add to your choice' : 'Your answer';
    ta.value = previous?.text ?? '';
    ta.oninput = sync;
    sync();
    const submit = async () => {
      if (send.disabled) {
        return;
      }
      send.disabled = true;
      reopened = null;
      await post([{ id: newId(), kind: 'answer', qid: q.id, target: 'question', line: Number(q.dataset.line) || null, quote: questionText(q), choice: chosen(), text: ta.value.trim() }]);
    };
    send.onclick = submit;
    ta.onkeydown = (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { submit(); }
      if (e.key === 'Escape') { e.stopPropagation(); ta.blur(); }
    };
    card.querySelector('[data-a=skip]').onclick = () => {
      if (questions.every((x) => x === q || answerOf(x) || skipped.has(x.id))) {
        skipped.clear();
      }
      skipped.add(q.id);
      renderQuestions();
    };
    card.querySelector('[data-a=cancel]').onclick = () => { reopened = null; renderQuestions(); };
    return card;
  }

  function questionLog() {
    const done = questions.map((q) => [q, answerOf(q)]).filter(([, c]) => c);
    const log = document.createElement('details');
    log.className = 'qa';
    log.open = Boolean($('details.qa')?.open);
    log.innerHTML = `<summary>Your answers (${done.length})</summary>`;
    done.forEach(([q, c]) => {
      const item = document.createElement('div');
      item.className = 'qa-item';
      item.innerHTML = '<button>Change</button><b></b><div class="a"></div>';
      item.querySelector('b').textContent = questionText(q);
      item.querySelector('.a').textContent = answerText(c);
      item.querySelector('button').onclick = () => { reopened = q; renderQuestions(); $('.qcard textarea').focus(); };
      const after = document.createElement('div');
      after.className = c.reply ? 'reply' : 'wait';
      if (c.reply) {
        after.textContent = c.reply.text;
      } else {
        after.append(loader('The agent is working on this'), 'The agent is working on this answer');
      }
      item.appendChild(after);
      log.appendChild(item);
    });
    log.hidden = !done.length;
    return log;
  }

  // Rebuilt only when what it shows changes, so a poll never wipes a half-typed answer.
  function renderQuestions() {
    const zone = $('.qzone');
    if (!zone) {
      return;
    }
    const open = questions.filter((x) => !answerOf(x)).length;
    zone.querySelector('.qz-head span').textContent = open ? `${plural(open, 'question')} to answer before the plan is final` : 'All answered';
    $('.draft-note').hidden = !open;
    const q = nextQuestion();
    if (q !== shownQuestion) {
      shownQuestion = q;
      zone.querySelector('.qcard')?.remove();
      if (q) {
        zone.querySelector('.qz-head').after(questionCard(q));
      }
    }
    const sig = sent.filter((c) => c.kind === 'answer').map((c) => `${c.id}${c.reply ? '+' : ''}`).join();
    if (sig !== logSig) {
      logSig = sig;
      zone.querySelector('details.qa')?.remove();
      zone.appendChild(questionLog());
    }
  }

  function setupQuestions() {
    if (!questions.length) {
      return;
    }
    const zone = document.createElement('div');
    zone.className = 'qzone';
    zone.innerHTML = '<div class="qz-head"><b>Questions for you</b><span></span></div>';
    $('main').prepend(zone);
    const note = document.createElement('div');
    note.className = 'draft-note';
    note.textContent = 'Draft: assumes the recommended answers until you answer the questions above';
    ($('main > .lede') ?? $('main > h1') ?? zone).after(note);
  }

  function render() {
    markTargets();
    renderQuestions();
    const waiting = sent.filter((c) => !c.reply).length;
    const counts = [drafts.length && `${drafts.length} unsent`, waiting && `${waiting} waiting`].filter(Boolean);
    $('#list').textContent = ['Comments', ...counts].join(' · ');
    $('#send').textContent = drafts.length ? `Send batch (${drafts.length})` : 'Send batch';
    $('#send').disabled = drafts.length === 0;
    renderApproval();
    renderPanel();
    if (sheetOwner && sheetTab === 'info' && isWaiting(sheetOwner) !== sheetWaiting) {
      renderSheet();
    }
  }

  function closePop() {
    document.querySelectorAll('.pop').forEach((p) => p.remove());
    if (pendingReload) {
      reloadKeepingScroll();
    }
  }

  function refsIn(el) {
    const refs = new Set();
    [el, ...el.querySelectorAll('code')].filter((c) => c.tagName === 'CODE').forEach((c) => {
      (c.textContent.match(REF) || []).forEach((r) => refs.add(r));
    });
    return [...refs];
  }

  function refsFor(el) {
    return el.matches('section > h2') ? refsIn(el.closest('section')).slice(0, 8) : refsIn(el);
  }

  function codeBlock(m) {
    const block = document.createElement('div');
    block.innerHTML = '<div class="head"><span></span><a>Open in VS Code</a></div><pre></pre>';
    block.querySelector('span').textContent = m.from ? `${m.path}:${m.from}${m.to > m.from ? `-${m.to}` : ''}` : m.path;
    block.querySelector('a').href = `vscode://file${m.abs}:${m.from || 1}`;
    const pre = block.querySelector('pre');
    m.lines.forEach((text, i) => {
      const n = m.start + i;
      const row = document.createElement('div');
      row.className = m.from && n >= m.from && n <= m.to ? 'hl' : '';
      row.innerHTML = `<i>${n}</i>`;
      row.append(text || ' ');
      pre.appendChild(row);
    });
    return block;
  }

  function note(box, text) {
    const div = document.createElement('div');
    div.className = 'miss';
    div.textContent = text;
    box.appendChild(div);
  }

  async function showCode(box, refs) {
    for (const ref of refs) {
      const found = await (await fetch(`/code?ref=${encodeURIComponent(ref)}`, { cache: 'no-store' })).json();
      found.matches.forEach((m) => box.appendChild(codeBlock(m)));
      if (!found.matches.length) {
        note(box, `${ref}: not found under the repo root`);
      }
      if (found.total > found.matches.length) {
        note(box, `${ref}: ${found.total - found.matches.length} more matches, give a longer path`);
      }
    }
  }

  const isWaiting = (owner) => sent.some((c) => !c.reply && c.kind === 'expand' && c.target === owner.dataset.ct);

  function parkMore() {
    $('.sheet-body').querySelectorAll('aside.more').forEach((a) => $('main').appendChild(a));
  }

  function askForm(hasMore) {
    const form = document.createElement('div');
    form.className = 'ask';
    form.innerHTML = '<p></p><textarea></textarea><div class="row"><span></span><button>Expand</button></div>';
    form.querySelector('p').textContent = hasMore ? 'Want more on this?' : 'No details yet. Ask the agent to expand this, optionally saying what to dig into.';
    const ta = form.querySelector('textarea');
    const button = form.querySelector('button');
    ta.placeholder = 'What to dig into (optional)';
    if (sheetWaiting) {
      ta.disabled = true;
      button.disabled = true;
      form.querySelector('.row span').append(loader('The agent is writing'), ' The agent is writing…');
    }
    button.onclick = async () => {
      button.disabled = true;
      await post([{ ...commentFrom(sheetOwner, ta.value.trim(), ''), kind: 'expand' }]);
    };
    return form;
  }

  function renderSheet() {
    const body = $('.sheet-body');
    parkMore();
    body.textContent = '';
    if (sheetTab === 'code') {
      const box = document.createElement('div');
      box.className = 'codes';
      body.appendChild(box);
      showCode(box, sheetRefs ?? refsFor(sheetOwner));
      return;
    }
    sheetWaiting = isWaiting(sheetOwner);
    const aside = mores.get(sheetOwner);
    if (aside) {
      aside.querySelectorAll('code').forEach((c) => c.classList.toggle('ref', served && Boolean(c.textContent.match(REF))));
      body.appendChild(aside);
    }
    body.appendChild(askForm(Boolean(aside)));
  }

  function showRefInSheet(code) {
    sheetRefs = code.textContent.match(REF);
    sheetTab = 'code';
    const sheet = $('.sheet');
    sheet.querySelector('[data-tab=code]').hidden = false;
    sheet.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === 'code'));
    renderSheet();
  }

  function openSheet(owner, tab) {
    const refs = served ? refsFor(owner) : [];
    stopLeaving($('.sheet'));
    sheetRefs = null;
    sheetOwner = owner;
    sheetTab = tab === 'code' && refs.length ? 'code' : 'info';
    togglePanel(false, true);
    document.querySelectorAll('.sheet-owner').forEach((e) => e.classList.remove('sheet-owner'));
    owner.classList.add('sheet-owner');
    const sheet = $('.sheet');
    sheet.hidden = false;
    document.body.classList.add('sheet-open');
    sheet.querySelector('.title').textContent = owner.dataset.ct;
    sheet.querySelector('[data-tab=code]').hidden = !refs.length;
    sheet.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === sheetTab));
    try { sessionStorage.setItem(SHEET_KEY, JSON.stringify({ ct: owner.dataset.ct, tab: sheetTab })); } catch {}
    renderSheet();
    revealOwner(owner);
  }

  function revealOwner(owner) {
    if (!compact.matches) {
      owner.scrollIntoView({ block: 'nearest' });
      return;
    }
    scrollTo({ top: owner.getBoundingClientRect().top + scrollY - $('.bar').getBoundingClientRect().bottom - 12, behavior: 'smooth' });
  }

  function dragSheet(e) {
    if (!compact.matches || e.target.closest('button')) {
      return;
    }
    const sheet = e.currentTarget.closest('.sheet, .panel');
    const startY = e.clientY;
    let dy = 0;
    sheet.classList.add('dragging');
    e.target.setPointerCapture(e.pointerId);
    const move = (ev) => {
      dy = ev.clientY - startY;
      sheet.style.transform = `translateY(${Math.max(0, dy)}px)`;
    };
    const end = () => {
      e.target.removeEventListener('pointermove', move);
      sheet.classList.remove('dragging');
      sheet.style.transform = '';
      settleSheet(sheet, dy);
    };
    e.target.addEventListener('pointermove', move);
    e.target.addEventListener('pointerup', end, { once: true });
    e.target.addEventListener('pointercancel', end, { once: true });
  }

  function settleSheet(sheet, dy) {
    const full = sheet.classList.contains('full');
    if (Math.abs(dy) < 6) {
      sheet.classList.toggle('full');
    } else if (dy < -40) {
      sheet.classList.add('full');
    } else if (dy > 80 && full) {
      sheet.classList.remove('full');
    } else if (dy > 80) {
      dismiss(sheet);
    }
  }

  function dismiss(sheet) {
    if (sheet.classList.contains('panel')) {
      togglePanel(false);
      return;
    }
    closeSheet();
  }

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

  function slideOut(el, done) {
    if (compact.matches || reducedMotion.matches) {
      done();
      return;
    }
    const end = (ev) => {
      if (ev.target !== el) {
        return;
      }
      el.removeEventListener('animationend', end);
      el.removeEventListener('animationcancel', end);
      const finished = ev.type === 'animationend' && el.classList.contains('leaving');
      el.classList.remove('leaving');
      document.body.classList.remove('leaving');
      if (finished) {
        done();
      }
    };
    el.addEventListener('animationend', end);
    el.addEventListener('animationcancel', end);
    el.classList.add('leaving');
    document.body.classList.add('leaving');
  }

  function stopLeaving(el) {
    el.classList.remove('leaving');
    document.body.classList.remove('leaving');
  }

  function closeSheet(instant = false) {
    const sheet = $('.sheet');
    const finish = () => {
      parkMore();
      sheet.hidden = true;
      sheet.classList.remove('full');
    };
    if (instant) {
      finish();
    } else {
      slideOut(sheet, finish);
    }
    document.body.classList.remove('sheet-open');
    sheetOwner?.classList.remove('sheet-owner');
    sheetOwner = null;
    try { sessionStorage.removeItem(SHEET_KEY); } catch {}
    if (pendingReload) {
      reloadKeepingScroll();
    }
  }

  function restoreSheet() {
    try {
      const saved = JSON.parse(sessionStorage.getItem(SHEET_KEY));
      const owner = saved && findTarget(saved.ct);
      if (owner) {
        openSheet(owner, saved.tab);
      }
    } catch {}
  }

  function placePop(pop, anchor) {
    const r = anchor.getBoundingClientRect();
    const edge = sheetOwner && !compact.matches ? document.documentElement.clientWidth - $('.sheet').offsetWidth : innerWidth;
    pop.style.left = `${Math.max(16, Math.min(r.left, edge - pop.offsetWidth - 16)) + scrollX}px`;
    pop.style.top = `${r.bottom + 10 + scrollY}px`;
  }

  function addTools(pop, anchor) {
    const tools = pop.querySelector('.tools');
    tools.innerHTML = '<button data-tab="info">ⓘ Info</button><button data-tab="code">‹/› Code</button>';
    tools.querySelector('[data-tab=info]').classList.toggle('has', mores.has(anchor));
    tools.querySelector('[data-tab=code]').hidden = !served || !refsFor(anchor).length;
    tools.onclick = (e) => {
      const b = e.target.closest('button');
      if (b) {
        openSheet(anchor, b.dataset.tab);
        closePop();
      }
    };
  }

  function openPop({ anchor, target, quote, text, general, tools, onSend, onBatch }) {
    document.querySelectorAll('.pop').forEach((p) => p.remove());
    const pop = document.createElement('div');
    pop.className = general ? 'pop general' : 'pop';
    pop.innerHTML = '<div class="target"></div><q></q><div class="tools"></div><textarea></textarea><div class="row"><button data-a="cancel">Cancel</button><button data-a="batch">Add to batch</button><button data-a="send" class="primary">Send now ⌘↵</button></div>';
    pop.querySelector('.target').textContent = general ? 'General comment' : target;
    pop.querySelector('q').textContent = quote || '';
    pop.querySelector('q').hidden = !quote;
    const ta = pop.querySelector('textarea');
    ta.placeholder = general ? 'The bigger picture: direction, scope, what is missing, what to cut…' : 'What should change, or what is unclear?';
    ta.value = text || '';
    const done = async (fn) => { if (ta.value.trim()) { await fn(ta.value.trim()); } closePop(); };
    pop.querySelector('[data-a=send]').onclick = () => done(onSend);
    pop.querySelector('[data-a=batch]').onclick = () => done(onBatch);
    pop.querySelector('[data-a=cancel]').onclick = closePop;
    ta.onkeydown = (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { done(onSend); }
      if (e.key === 'Escape') { e.stopPropagation(); closePop(); }
    };
    if (tools) {
      addTools(pop, anchor);
    }
    document.body.appendChild(pop);
    if (!general) {
      placePop(pop, anchor);
    }
    ta.focus();
  }

  function commentFrom(el, text, quote) {
    return { id: newId(), target: el ? el.dataset.ct : 'document', line: el ? Number(el.dataset.line) || null : null, quote, text };
  }

  function defaultTab(el) {
    if (mores.has(el) || !served || !refsFor(el).length) {
      return 'info';
    }
    return 'code';
  }

  function commentOn(el) {
    const sel = getSelection();
    const quote = sel && !sel.isCollapsed && el.contains(sel.anchorNode) ? sel.toString().trim().slice(0, 300) : '';
    const sheetFollows = !compact.matches && !el.closest('.sheet');
    if (sheetFollows && sheetOwner !== el) {
      openSheet(el, defaultTab(el));
    }
    openPop({
      anchor: el,
      target: el.dataset.ct,
      quote,
      onSend: (text) => post([commentFrom(el, text, quote)]),
      onBatch: (text) => { drafts.push(commentFrom(el, text, quote)); persist(); render(); },
      tools: !sheetFollows && !el.closest('aside.more'),
    });
  }

  async function submitGeneral(send) {
    const ta = $('.panel .general textarea');
    const text = ta.value.trim();
    if (!text) {
      return;
    }
    ta.value = '';
    if (send) {
      await post([commentFrom(null, text, '')]);
      return;
    }
    drafts.push(commentFrom(null, text, ''));
    persist();
    render();
  }

  function togglePanel(open, instant = false) {
    const panel = $('.panel');
    if (open && sheetOwner) {
      closeSheet(true);
    }
    if (open) {
      stopLeaving(panel);
      panel.classList.add('open');
    } else if (instant) {
      panel.classList.remove('open', 'full');
    } else if (panel.classList.contains('open')) {
      slideOut(panel, () => panel.classList.remove('open', 'full'));
    }
    $('#list').classList.toggle('on', open);
    $('#list').classList.remove('pulse');
    if (open && !compact.matches) {
      $('.panel .general textarea').focus();
    }
  }

  function editDraft(i) {
    const c = drafts[i];
    const el = c.target === 'document' ? null : findTarget(c.target);
    if (el) {
      el.scrollIntoView({ block: 'center' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1200);
    }
    openPop({
      anchor: el,
      general: !el,
      target: c.target,
      quote: c.quote,
      text: c.text,
      onSend: (text) => { drafts.splice(i, 1); persist(); return post([{ ...c, text }]); },
      onBatch: (text) => { c.text = text; persist(); render(); },
    });
  }

  async function post(list) {
    try {
      if (!served) { throw new Error('file'); }
      const res = await fetch('comments', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ doc: DOC, comments: list }) });
      if (!res.ok) { throw new Error(res.status); }
      sent = sent.concat(list.map((c) => ({ ...c, reply: null })));
      render();
    } catch {
      const md = list.map((c) => `- [${targetName(c)}]${c.quote ? ` "${c.quote}"` : ''} ${c.text}`).join('\n');
      await navigator.clipboard.writeText(`Comments on ${DOC}:\n${md}`);
      drafts = drafts.concat(list.filter((c) => !drafts.includes(c)));
      persist();
      render();
      alert('No agent server is listening. The comments were copied to the clipboard and kept as unsent.');
    }
  }

  const isPlan = Boolean(document.querySelector('main h1[data-mode="plan"]'));

  function plural(n, word) {
    return `${n} ${word}${n === 1 ? '' : 's'}`;
  }

  function openItems() {
    const waiting = sent.filter((c) => !c.reply && c.kind !== 'approve').length;
    const typed = [...document.querySelectorAll('textarea')].some((t) => t.value.trim());
    const unanswered = questions.filter((q) => !answerOf(q)).length;
    return [
      unanswered && `${plural(unanswered, 'unanswered question')}`,
      drafts.length && `${plural(drafts.length, 'unsent comment')} in the batch`,
      waiting && `${plural(waiting, 'comment')} still waiting for the agent`,
      typed && 'Text in a comment field that has not been sent',
    ].filter(Boolean);
  }

  const approvalOf = () => sent.find((c) => c.kind === 'approve' && c.version === version);

  function renderApproval() {
    const approved = approvalOf();
    $('#approve').hidden = !isPlan || !served || Boolean(approved);
    $('#approved').hidden = !approved;
    if (approved) {
      const at = new Date(approved.sentAt ?? Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      $('#approved').textContent = `✓ Approved ${at}`;
    }
  }

  async function approve() {
    await post([{ ...commentFrom(null, '', ''), kind: 'approve', version, sentAt: new Date().toISOString() }]);
  }

  function requestApproval() {
    const items = openItems();
    if (!items.length) {
      approve();
      return;
    }
    const dialog = $('dialog.confirm');
    const list = dialog.querySelector('ul');
    list.textContent = '';
    items.forEach((text) => {
      const li = document.createElement('li');
      li.textContent = text;
      list.appendChild(li);
    });
    dialog.showModal();
  }

  async function sendBatch() {
    const batch = drafts;
    drafts = [];
    persist();
    await post(batch);
  }

  function reloadKeepingScroll() {
    try { sessionStorage.setItem(SCROLL_KEY, String(scrollY)); } catch {}
    location.reload();
  }

  function restoreScroll() {
    try {
      const y = sessionStorage.getItem(SCROLL_KEY);
      if (y !== null) {
        sessionStorage.removeItem(SCROLL_KEY);
        scrollTo(0, Number(y));
      }
    } catch {}
  }

  function markDeltas(lines) {
    const wanted = new Set(lines.map(String));
    const changed = [...document.querySelectorAll('main [data-line], .sheet-body [data-line]')].filter((el) => wanted.has(el.dataset.line) && el.parentElement.dataset.line !== el.dataset.line);
    const outermost = changed.filter((el) => !changed.some((outer) => outer !== el && outer.contains(el)));
    deltas = [...new Set(outermost.map(ownerOf))];
    deltas.forEach((el) => el.classList.add('delta'));
    $('#changes').hidden = deltas.length === 0;
    $('#clear-changes').hidden = deltas.length === 0;
    $('#changes').textContent = `${deltas.length} changed`;
  }

  function nextDelta() {
    const el = deltas[deltaIndex % deltas.length];
    deltaIndex += 1;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // Changes are outlined against a baseline that only moves when the reader clears them.
  function baseVersion() {
    try {
      const base = sessionStorage.getItem(BASE_KEY);
      if (base) {
        return base;
      }
      sessionStorage.setItem(BASE_KEY, RENDERED);
    } catch {}
    return RENDERED;
  }
  const since = baseVersion();

  function clearDeltas() {
    try { sessionStorage.setItem(BASE_KEY, RENDERED); } catch {}
    deltas.forEach((el) => el.classList.remove('delta'));
    deltas = [];
    $('#changes').hidden = true;
    $('#clear-changes').hidden = true;
  }

  const STATUS = {
    listening: { label: 'Agent listening', hint: 'Comments reach the agent as you send them.' },
    idle: {
      label: 'Agent not listening',
      hint: 'Comments are saved. Click to see how to resume.',
      help: 'Your comments are saved on this page, but none reach the agent until it listens again. Send this in the agent session:',
      ask: `Pick up the comments on ${DOC} and listen again`,
    },
    offline: {
      label: 'Server stopped',
      hint: 'Nothing can be sent. Click to see how to restart.',
      help: 'The explainer server has stopped, so nothing can be sent. Send this in the agent session:',
      ask: `Restart the explainer for ${DOC}`,
    },
  };

  function showStatus(kind) {
    const el = $('#status');
    el.className = `status ${kind}`;
    el.dataset.kind = kind;
    el.title = STATUS[kind].hint;
    el.firstElementChild.textContent = STATUS[kind].label;
  }

  function showStatusHelp() {
    const { label, help, ask } = STATUS[$('#status').dataset.kind] ?? {};
    if (!ask) {
      return;
    }
    closePop();
    const pop = document.createElement('div');
    pop.className = 'pop status-help';
    pop.innerHTML = '<div class="target"></div><p></p><pre></pre><div class="row"><button data-a="close">Close</button><button data-a="copy" class="primary">Copy</button></div>';
    pop.querySelector('.target').textContent = label;
    pop.querySelector('p').textContent = help;
    pop.querySelector('pre').textContent = ask;
    pop.querySelector('[data-a=close]').onclick = closePop;
    pop.querySelector('[data-a=copy]').onclick = async (e) => {
      try {
        await navigator.clipboard.writeText(ask);
        e.target.textContent = 'Copied';
      } catch {
        getSelection().selectAllChildren(pop.querySelector('pre'));
        e.target.textContent = 'Press ⌘C';
      }
    };
    document.body.appendChild(pop);
    placePop(pop, $('#status'));
  }

  async function poll() {
    try {
      const state = await (await fetch(`state?since=${encodeURIComponent(since)}`, { cache: 'no-store' })).json();
      showStatus(state.listening ? 'listening' : 'idle');
      if (version !== null && state.v !== version) {
        if ([...document.querySelectorAll('textarea')].some((t) => t.value.trim())) {
          pendingReload = true;
          $('#reload').hidden = false;
          return;
        }
        reloadKeepingScroll();
        return;
      }
      if (version === null) {
        markDeltas(state.changed);
      }
      version = state.v;
      const replies = state.sent.filter((c) => c.reply).length;
      if (seenReplies !== null && replies > seenReplies && !$('.panel').classList.contains('open')) {
        $('#list').classList.add('pulse');
      }
      seenReplies = replies;
      showUnseen(replies);
      sent = state.sent;
      render();
    } catch {
      showStatus('offline');
    }
  }

  function showButtonFor(el) {
    clearTimeout(hideTimer);
    if (hot !== el) {
      hot?.classList.remove('hot');
      hot = el;
      hot.classList.add('hot');
    }
    const r = el.getBoundingClientRect();
    const badgeOffset = el.dataset.cn ? 28 : 0;
    cbtn.style.left = `${r.right + scrollX - 13 - badgeOffset}px`;
    cbtn.style.top = `${r.top + scrollY - 13}px`;
    cbtn.classList.add('show');
  }

  function hideButtonSoon() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      hot?.classList.remove('hot');
      hot = null;
      cbtn.classList.remove('show');
    }, 180);
  }

  document.addEventListener('click', (e) => {
    const ref = e.target.closest('.sheet-body code.ref');
    if (ref) {
      showRefInSheet(ref);
      return;
    }
    if (e.target.closest('.bar, .panel, .pop, nav, .cbtn, .h-cbtn, a, button, dialog, .sheet .ask, .qzone')) {
      return;
    }
    const el = e.target.closest('[data-ct]');
    if (el) {
      commentOn(el);
    } else if (document.querySelector('.pop:not(.general)')) {
      closePop();
    }
  });

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('.cbtn')) {
      clearTimeout(hideTimer);
      return;
    }
    const el = e.target.closest('[data-ct]');
    if (el && el.tagName !== 'H2' && !el.closest('.pop')) {
      showButtonFor(el);
    } else {
      hideButtonSoon();
    }
  });

  document.addEventListener('keydown', (e) => {
    const typing = e.target.closest?.('textarea, input, [contenteditable]');
    if (KEYS[e.key] && !typing && !e.metaKey && !e.ctrlKey && !e.altKey && !$('dialog.confirm').open) {
      e.preventDefault();
      KEYS[e.key]();
      return;
    }
    if (e.key !== 'Escape' || $('dialog.confirm').open) {
      return;
    }
    if (document.querySelector('.pop')) {
      closePop();
    } else if (sheetOwner) {
      closeSheet();
    } else if ($('.panel').classList.contains('open')) {
      togglePanel(false);
    }
  });

  cbtn.innerHTML = ICON;
  cbtn.onmousedown = (e) => e.preventDefault();
  cbtn.onclick = () => { if (hot) { commentOn(hot); } };
  $('#list').onclick = () => togglePanel(!$('.panel').classList.contains('open'));
  $('#status').onclick = showStatusHelp;
  $('#theme').onclick = toggleTheme;
  systemDark.addEventListener('change', showThemeButton);
  $('.panel .general [data-a=batch]').onclick = () => submitGeneral(false);
  $('.panel .general [data-a=send]').onclick = () => submitGeneral(true);
  $('.panel .general textarea').onkeydown = (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      submitGeneral(true);
    }
  };
  $('.sheet .close').onclick = closeSheet;
  $('.scrim').onclick = () => dismiss(sheetOwner ? $('.sheet') : $('.panel'));
  $('.panel .handle').addEventListener('pointerdown', dragSheet);
  $('.sheet .handle').addEventListener('pointerdown', dragSheet);
  $('.sheet header').addEventListener('pointerdown', dragSheet);
  $('.sheet .tabs').onclick = (e) => {
    const b = e.target.closest('button');
    if (b && sheetOwner) {
      openSheet(sheetOwner, b.dataset.tab);
    }
  };
  $('#send').onclick = sendBatch;
  $('#approve').onclick = requestApproval;
  document.addEventListener('visibilitychange', () => showUnseen(sent.filter((c) => c.reply).length));
  $('dialog.confirm [data-a=cancel]').onclick = () => $('dialog.confirm').close();
  $('dialog.confirm [data-a=ok]').onclick = () => {
    $('dialog.confirm').close();
    approve();
  };
  $('#reload').onclick = reloadKeepingScroll;
  addEventListener('resize', positionPins);
  new ResizeObserver(([entry]) => {
    document.documentElement.style.setProperty('--bar-h', `${Math.ceil(entry.borderBoxSize[0].blockSize)}px`);
    positionPins();
  }).observe($('.bar'));
  $('#changes').onclick = nextDelta;
  $('#clear-changes').onclick = clearDeltas;

  showThemeButton();
  requestAnimationFrame(() => requestAnimationFrame(() => $('#theme').classList.add('ready')));
  tagTargets();
  collectMores();
  setupQuestions();
  addSectionButtons();
  buildToc();
  render();
  restoreScroll();
  restoreSheet();
  if (served) { poll(); setInterval(poll, 2000); }
})();
</script>
</body>
</html>
